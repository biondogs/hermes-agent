      response (local boot or an error menu) with a properly built context;
      assign the context before rendering and dereference nic only after the
      None case is handled.
    blast_radius: >
      Machines whose admin unchecked the bootable flag get HTTP errors at
      every PXE boot instead of a graceful local boot; also pollutes logs
      with tracebacks on every retry loop iteration.
    regression_test: >
      test_ipxe_no_bootable_nic_returns_valid_script: request the iPXE
      endpoint for a system whose NICs exist but are all non-bootable and
