services:
  twin:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-estate-twin:latest
    container_name: hermes-estate-twin
    hostname: hermes-estate-twin
    # Isolated network — no route to host/LiteLLM/Hindsight/Telegram/gateway.
    networks:
      twin-internal:
        aliases: [twin]
    volumes:
      # Bind-mount the synced twin root (NEVER baked into image layers).
      - ./twin-root/hermes-agent:/opt/twin/hermes-agent:rw
      - ./twin-root/hermes-home:/opt/twin/hermes-home:rw
      - ./twin-root/hermes-estate:/opt/twin/hermes-estate:ro
      # Entrypoint needs to see the source for pip install
      - ./sync:/opt/twin-sync:ro
      - ../estate-steward/twin-tools:/opt/twin-tools:ro
    environment:
      HERMES_HOME: /opt/twin/hermes-home
      HERMES_AGENT_SRC: /opt/twin/hermes-agent
      TWIN_ROOT: /opt/twin
      PYTHONUNBUFFERED: "1"
    # No ports published — avoids collision with live estate 9090/4000/3002/8888/9999.
    # Gateway must never start with real tokens; placeholders only.
    restart: "no"
    # Resource limits — don't starve the host.
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      mock-model:
        condition: service_started
      fake-telegram:
        condition: service_started

  mock-model:
    image: python:3.14-slim-trixie
    container_name: hermes-estate-twin-mock-model
    hostname: mock-model
    networks:
      twin-internal:
        aliases: [mock-model]
    volumes:
      - ../estate-steward/twin-tools:/opt/twin-tools:ro
    working_dir: /opt/twin-tools
    command: ["python3", "mock_model.py"]
    environment:
      MOCK_MODEL_PORT: "8080"
      PYTHONUNBUFFERED: "1"
    restart: "no"

  fake-telegram:
    image: python:3.14-slim-trixie
    container_name: hermes-estate-twin-fake-telegram
    hostname: fake-telegram
    networks:
      twin-internal:
        aliases: [fake-telegram]
    volumes:
      - ../estate-steward/twin-tools:/opt/twin-tools:ro
    working_dir: /opt/twin-tools
    command: ["python3", "fake_telegram.py"]
    environment:
      FAKE_TELEGRAM_PORT: "8081"
      PYTHONUNBUFFERED: "1"
    restart: "no"

networks:
  twin-internal:
    name: hermes-estate-twin-internal
    driver: bridge
    internal: true
