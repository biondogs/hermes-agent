  - id: CC-004
    type: bug
    severity: S1
    title: "Installers bake in admin:admin and changemenow default credentials"
    user_value: null
    evidence:
      - path: Dockerfile
        lines: 75-77
        excerpt: |
            RUN echo "DJANGO_SUPERUSER_USERNAME=admin" > /var/www/mprov_control_center/.env && \
                echo "DJANGO_SUPERUSER_PASSWORD=admin" >> /var/www/mprov_control_center/.env && \
                echo "DJANGO_SUPERUSER_EMAIL=root@localhost" >> /var/www/mprov_control_center/.env
      - path: install_scripts/install_mpcc.sh
        lines: 221-223
        excerpt: |
            echo "DJANGO_SUPERUSER_USERNAME=admin" >> .env
            echo "DJANGO_SUPERUSER_PASSWORD=admin" >> .env
            echo "DJANGO_SUPERUSER_EMAIL=root@localhost" >> .env
      - path: stack.env
        lines: 1-2
        excerpt: |
            MYSQL_DATABASE=mprov
            MYSQL_ROOT_PASSWORD=changemenow
    repro: >
      Both the Docker image build and the bare-metal installer create the
      Django superuser with username admin and password admin, and the shipped
      compose stack sets the MariaDB root password to changemenow. The README
      documents the admin admin pair as the default credentials, so every
      deployment that skips a rename step shares the same well-known control
      plane password; nothing forces a change on first login.
    fix_idea: >
      Generate a random superuser and database password at install time and
      show them to the operator once (or write them to a root-only file), add
      a first-login forced password change, and refuse to start with a known
      default credential. Remove the literal passwords from the Dockerfile and
      the stack.env template.
    blast_radius: >
      Any internet- or intranet-reachable deployment left on defaults gives
      full admin access (including CC-002 secret reads) to anyone who knows
      the public README; the database is reachable with the same known value.
      Affects every deployment that follows the quick-start path.
    regression_test: >
      test_install_refuses_default_admin_password: run the installer with no
      password input in a test container and assert it either generates a
      random credential or fails, and that no .env contains the literal string
      admin as a password. Fails today, passes after the fix.
  - id: CC-005
    type: bug
    severity: S1
    title: "Unauthenticated register endpoint binds attacker MAC to systems"
    user_value: null
    evidence:
      - path: systems/views.py
        lines: 61-62
        excerpt: |
            authentication_classes = [] #disables authentication
            permission_classes = [] #disables permission
      - path: systems/views.py
        lines: 110-115
        excerpt: |
            if port is not None:
                nicQueryset = NetworkInterface.objects.all()
                nicQueryset = nicQueryset.filter(mac=None, switch_port=port)
                #print(nicQueryset)
                if nicQueryset is not None and len(nicQueryset) > 0:
                    system = System.objects.get(pk=nicQueryset[0].system.pk)
    repro: >
      POST /systems/register/ needs no authentication at all. The handler
      matches the request's switch and port against network interfaces whose
      MAC is still unset, then permanently assigns the attacker-supplied MAC to
      whichever system holds that switch port. Any host on the provisioning
      network can claim any not-yet-registered system identity by sending its
      MAC with the right switch and port pair, after which the control center
      serves that system's identity, iPXE config and disk image to the
      attacker's machine.
    fix_idea: >
      Gate registration behind a per-deployment enrollment token or an
      admin-approved pending queue: a first POST should create a pending
      enrollment record awaiting approval, and only an authenticated admin or
      a scoped step-up token should commit the MAC binding to a system. At
      minimum, bind to the true socket peer address rather than any
      client-supplied identification data.
    blast_radius: >
      Scenario: a rogue or compromised machine on the provisioning VLAN claims
      an unregistered server's switch-port identity and receives that server's
      provisioned disk image (with its root password and fleet certificates),
      permanently poisoning inventory data. Reachable by anyone with layer-2
      access to the provisioning network on every deployment.
    regression_test: >
      test_register_requires_enrollment_token: POST /systems/register/ without
      the token and assert 401 or that only a pending record is created and no
      NetworkInterface row is modified. Fails today (binding happens), passes
      after gating.
  - id: CC-006
    type: bug
    severity: S1
    title: "Unauthenticated image endpoints trust spoofable X-Forwarded-For"
    user_value: null
    evidence:
      - path: systems/views_noauth.py
        lines: 47-51
        excerpt: |
            x_forwarded_for = request.META.get('HTTP_X_FORWARDED_FOR')
            if x_forwarded_for:
                ip = x_forwarded_for.split(',')[0]
            else:
                ip = request.META.get('REMOTE_ADDR')
      - path: systems/views_noauth.py
        lines: 275-279
        excerpt: |
            x_forwarded_for = request.META.get('HTTP_X_FORWARDED_FOR')
            if x_forwarded_for:
                ip = x_forwarded_for.split(',')[0]
            else:
                ip = request.META.get('REMOTE_ADDR')
    repro: >
      The unauthenticated kernel, initrd and iPXE endpoints decide which
      system's data to serve purely from the client-controlled
      X-Forwarded-For header, falling back to the socket address only when it
      is absent. Anyone who can reach the HTTP port can send a forged header
      naming any managed IP and receive that system's iPXE configuration,
      kernel, initramfs, or installer key downloads.
    fix_idea: >
      Use the actual socket peer address for client identification on these
      endpoints, and honor X-Forwarded-For only when the connection provably
      arrives from a trusted reverse proxy (configured proxy list or
      trusted-proxy middleware). Never let header-derived identity authorize
      secret downloads.
    blast_radius: >
      Scenario: a host on any network segment that can route to the mPCC HTTP
      port forges a peer header and downloads an installer security token or
      any machine's boot artifacts, enabling the CC-001 escalation and image
      inspection for password retrieval. Possible on every deployment, on
      every unauthenticated request.
    regression_test: >
      test_ipxe_endpoint_ignores_forwarded_for: request the iPXE endpoint with
      a mismatched X-Forwarded-For from a non-proxy client address and assert
      the response reflects the real peer address or is refused. Fails today,
      passes after the fix.
  - id: CC-007
    type: bug
    severity: S3
    title: "Authenticated system endpoints trust spoofable X-Forwarded-For"
    user_value: null
    evidence:
      - path: systems/views.py
        lines: 272-276
        excerpt: |
            x_forwarded_for = request.META.get('HTTP_X_FORWARDED_FOR')
            if x_forwarded_for:
                ip = x_forwarded_for.split(',')[0]
            else:
                ip = request.META.get('REMOTE_ADDR')
      - path: systems/views.py
        lines: 365-369
        excerpt: |
            x_forwarded_for = request.META.get('HTTP_X_FORWARDED_FOR')
            if x_forwarded_for:
                ip = x_forwarded_for.split(',')[0]
            else:
                ip = request.META.get('REMOTE_ADDR')
    repro: >
      The authenticated system and kernel-commandline endpoints use the same
      header-first client IP logic for the ?self lookup: an authenticated
      caller (including any API-key holder) can select an arbitrary system's
      record by sending a forged X-Forwarded-For instead of only their own, and
      also poison the auto-created NetworkInterface with an address they do
      not own.
    fix_idea: >
      Restrict the ?self lookup to the true socket address, honor forwarded
      headers only from configured trusted proxies, and make any
      header-selected identity an explicit admin-scoped action rather than an
      implicit self-identification.
    blast_radius: >
      Authenticated callers can read and bind other hosts' data through ?self
      lookups; low likelihood of accidental trigger but it undermines the
      self-identification contract on every ?self request.
    regression_test: >
      test_self_lookup_uses_socket_address: request the systems self endpoint
      with a forged forwarded header from an authenticated client and assert
      the returned system matches the socket address. Fails today, passes
      after.
  - id: CC-008
    type: bug
    severity: S1
    title: "NFS export with no_root_squash exposes provisioning image share"
    user_value: null
    evidence:
      - path: install_scripts/create_mprov_share.sh
        lines: 34
        excerpt: |
            grep -qF '/export/mprov' /etc/exports || echo '/export/mprov    *(rw,no_root_squash,sync)' >> /etc/exports
    repro: >
      The installer exports the mProv share (which contains OS images and
      installer scripts served to every managed machine) read-write to all
      hosts with no_root_squash. Any machine that can mount NFS from the mPCC
      server can create files as root, including replacing the disk images and
      scripts that get pushed to fleet machines.
    fix_idea: >
      Drop no_root_squash, restrict the export to the provisioning subnet or
      specific jobserver hosts, and export read-only where consumers only
      read. If root-writes are genuinely needed for a specific tool, scope the
      exception to that client host rather than the wildcard.
    blast_radius: >
      Scenario: any host with network reach to the NFS port mounts the share
      and overwrites a fleet image or installer script as root; the next
      provisioning run writes the attacker payload to a managed machine with
      root privilege. Affects every bare-metal install that ran the script.
    regression_test: >
      test_exports_no_no_root_squash: source the script in a test container
      and assert the appended export line contains no no_root_squash token.
      Fails today, passes after.
  - id: CC-009
    type: bug
    severity: S3
    title: "DRF default permissions require both session and API key"
    user_value: null
    evidence:
      - path: mprov_control_center/settings.py
        lines: 251-254
        excerpt: |
            'DEFAULT_PERMISSION_CLASSES': (
                'rest_framework.permissions.IsAuthenticated',
                'rest_framework_api_key.permissions.HasAPIKey',
            ),
      - path: networks/api_views.py
        lines: 11-12
        excerpt: |
            @api_view(['POST'])
            def update_network_with_confirmation(request, pk):
    repro: >
      DRF conjoins every listed default permission class, so views that do not
      override permission_classes (the two network confirmation endpoints)
      require a request to carry both an authenticated session or basic-auth
      credential and an API key simultaneously. A normal admin session or a
      normal agent key alone is rejected, leaving these REST endpoints usable
      only by a client that happens to present both credential kinds.
    fix_idea: >
      Decide per endpoint who may call it and set explicit permission_classes
      there; if both operator sessions and agent keys are meant to be
      accepted, express it with an OR-composed permission class rather than
      the global default list, which DRF always ANDs.
    blast_radius: >
      The update-with-confirmation and preview-subnet-changes REST endpoints
      effectively cannot be used by any natural client; the admin UI works
      around them via its own flow, so API consumers silently hit 401 or 403.
    regression_test: >
      test_confirmation_endpoint_accepts_admin_session: POST to
      update-with-confirmation with an authenticated staff session and no API
      key, assert the permission check passes with stubbed network logic.
      Fails today with 401 or 403, passes after explicit per-view permissions.
  - id: CC-010
    type: bug
    severity: S2
    title: "Unauthenticated GET permanently removes jobservers from images"
    user_value: null
    evidence:
      - path: systems/views_noauth.py
        lines: 95-100
        excerpt: |
            while ( statCode <= 199 or statCode >=400):
              # jobsever gave a bad response, remove it and retry.
              js_set.remove(js)
              print("Removing Jobserver " + str(js) + ", URL: " + imageURL + " not accessible. Status: " + str(statCode))
              image.jobservers.set(js_set)
              image.save()
      - path: systems/views_noauth.py
        lines: 223-228
        excerpt: |
            while ( statCode <= 199 or statCode >=400):
              # jobsever gave a bad response, remove it and retry.
              js_set.remove(js)
              print("Removing Jobserver " + str(js) + ", URL: " + imageURL + " not accessible. Status: " + str(statCode))
              image.jobservers.set(js_set)
              image.save()
    repro: >
      A plain GET of the kernel, initrd or image-download endpoints treats any
      non-2xx fetch status as grounds to strip a jobserver from the image and
      save the image row, from an unauthenticated request whose identity is a
      spoofable header. If a jobserver is momentarily busy or restarting, the
      association is permanently deleted. When the last jobserver is removed,
      the retry loop indexes the empty set and the request 500s.
    fix_idea: >
      Never persist association changes from unauthenticated read paths;
      treat jobserver health as a separate authenticated maintenance task with
      retry thresholds, mark servers unhealthy in cache instead of deleting
      relations, and guard the empty-set case before indexing.
    blast_radius: >
      Boot-time requests during a jobserver restart leave images with no
      hosting jobserver, so subsequent boots fail until an admin re-adds the
      server; triggered silently by routine traffic on every deployment using
      these endpoints.
    regression_test: >
      test_get_does_not_mutate_jobserver_set_on_error: hit the unauth image
      endpoint with a stubbed jobserver returning 503 and assert the image
      row's jobservers relation is unchanged and the response is a clean
      fallback. Fails today (relation shrinks), passes after.
  - id: CC-011
    type: bug
    severity: S2
    title: "IPXE endpoint crashes with 500 when no bootable NIC exists"
    user_value: null
    evidence:
      - path: systems/views_noauth.py
        lines: 321-328
        excerpt: |
            if nic==None:
              # not bootable, we just return and let the template handle it.
              if not nic.bootable:
                rendered: str = template.render(context)
                context= {
                'nic': nic,
              }
            return(render(template_name="ipxe", request=request, context=context, content_type="text/plain" ))
    repro: >
      When a known IP's system has NICs but none flagged bootable, the code
      keeps nic as None and then evaluates not nic.bootable, raising
