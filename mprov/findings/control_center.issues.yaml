        excerpt: |
            def post(self, request, *args, **kwargs):
                print(request.data)
                if request.data['password'] == "":
                    del request.data['password']
    repro: >
      Trigger any BMC power or PXE-boot action from the admin UI or the power
      endpoint: the operator username and password are printed on the server
      console and into container logs twice (once in the debug line, once
      inside the assembled ipmitool command), and the password then sits in the
      process argv of the spawned ipmitool child, where it is visible to every
      local user via the process table. The BMC POST handler additionally
      dumps the whole request body, including submitted passwords, to stdout.
    fix_idea: >
      Remove the credential-bearing print statements and route debug output
      through a logger that never carries secrets; pass BMC credentials to
      ipmitool via an environment variable or stdin rather than command-line
      switches so they do not appear in argv, and do not log raw request bodies
      on endpoints that accept passwords.
    blast_radius: >
      Scenario: log aggregation or an operator terminal captures the printed
      BMC credentials for every chassis action, and any local shell user on the
      mPCC host can read live passwords from the process list; those
      credentials control power and boot for the entire fleet. Happens on every
      power action in every deployment.
    regression_test: >
      test_power_action_does_not_leak_credentials: run a power action with a
