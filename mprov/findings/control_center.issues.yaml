  - id: CC-013
    type: bug
    severity: S2
    title: "Detail retrieval globally mutates serializer Meta depth and never resets"
    user_value: null
    evidence:
      - path: common/views.py
        lines: 125-128
        excerpt: |
            if 'pk' in kwargs:
                self.serializer_class.Meta.depth = 3
                # someone is looking for a specific item.
                return self.retrieve(self, request, format=None, pk=kwargs['pk'])
