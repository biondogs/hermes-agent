        lines: 141-143
        excerpt: |
          def main(self):
            self.startSession()
            self.run()
    repro: >
      run signals failure by returning 1 (register_IPv6_ll.py lines 36 and
      67) or by a bare return (setupBMC.py lines 59 through 117 after each
      ipmitool or parse error), but the MScript main methods call run without
      using its return value, so script.main() returns None, the module-level
      main returns None, and the sys.exit around main translates None to exit
      status 0. Both scripts therefore print "Error: ..." messages and still
      exit successfully.
    fix_idea: >
      Propagate the run status: have the MScript main return the value
      returned by run (converting bare failure returns into a nonzero
      status) so the module-level exit reflects the real outcome.
    blast_radius: >
      Failed IPv6 link-local registration and failed BMC setup are invisible
      to any caller that checks exit status — the jobserver's logs carry the
      error text while the process reports success, and the runner currently
      ignores exit codes entirely (see the cross-repo observation in
      REVIEW-NOTES), compounding the problem. Operators must eyeball every
      log line.
    regression_test: >
      test_run_failure_yields_nonzero_exit: drive register_IPv6_ll.py with a
      stubbed session returning a non-200 for the interfaces query and assert
      the process exit status is nonzero. Fails today with status 0; passes
      once the status propagates through main.

  - id: SCR-012
    type: bug
    severity: S3
    title: "Backup script always reports success even when every dump failed"
    user_value: null
    evidence:
      - path: tools/backup-mprov.sh
        lines: 4-12
        excerpt: |
          cd /var/www/mprov_control_center/

          . ./bin/activate

          rm -rf /tmp/mprov_backup/
          mkdir -p /tmp/mprov_backup/

          echo  "disklayouts: "
          python3 manage.py dumpdata disklayouts --indent=2 --format yaml -o /tmp/mprov_backup/mprov_disklayouts.yaml
      - path: tools/backup-mprov.sh
        lines: 30-34
        excerpt: |
          tar -zcf mprov_backup.tar.gz mprov_backup/
          echo "Done"
          echo

          echo "Backup saved to /tmp/mprov_backup.tar.gz"
    repro: >
      There is no fail-fast error handling and no per-command status check,
      so a failed cd at line 4, a failed venv activation at line 6, or any
      number of failed dumpdata invocations (run from the wrong directory
      when the cd failed) never stop the script. The final statement is an
      echo, so the script exits 0 and prints "Backup saved to
      /tmp/mprov_backup.tar.gz" even when the tarball contains a partial or
      empty directory tree.
    fix_idea: >
      Fail fast on the cd and the venv activation, check the status of each
      dump before proceeding, and only print the saved-message (and exit 0)
      when every component dump and the tar step succeeded; consider writing
      the backup outside the volatile /tmp directory.
    blast_radius: >
      Operators relying on this backup routine get a warm confirmation for a
      useless backup whenever the control center path, venv or dumps fail —
      the damage is discovered only at restore time, when the missing data is
      needed most.
    regression_test: >
      test_backup_fails_when_dumps_fail: run the script in a sandbox where
      /var/www/mprov_control_center exists but manage.py fails, and assert a
      nonzero exit and no "Backup saved" message. Fails today — exit 0 with
      the success message; passes once statuses are checked.

  - id: SCR-013
    type: bug
    severity: S3
    title: "BMC and InfiniBand IPs silently wrong when node IP misses mgmt prefix"
    user_value: null
    evidence:
      - path: tools/import_systems_csv.sh
        lines: 77-82
        excerpt: |
          m_ipaddr=`host ${DATA[0]} | awk '{print $4}'`

          fi
          # let's get the bmc ip
          bmcIp=`echo $m_ipaddr | sed -e "s/$mgmtNet/$bmcNet/g"`
          ibIp=`echo $m_ipaddr | sed -e "s/$mgmtNet/$ibNet/g"`
    repro: >
      The BMC and InfiniBand addresses are fabricated by textual prefix
      substitution on the management IP (defaults 172.20. to 172.29. and
      172.21.). When the resolved node IP does not start with the configured
      management prefix — a different subnet, a CNAME chain changing the host
      command output shape, or a failed name resolution leaving m_ipaddr
      empty — the substitutions are no-ops and the generated mash input
      records the BMC and InfiniBand interfaces with a copy of (or an empty)
      management IP. The import proceeds and creates conflicting or blank
      interface and BMC rows with no warning.
    fix_idea: >
      After the substitution, verify the result actually changed and matches
      the intended BMC or InfiniBand subnet, and fail the row (or the whole
      import) with a clear message when it does not; validate the resolved
      management IP for non-emptiness before deriving anything from it.
    blast_radius: >
      Bulk-importing a CSV whose nodes resolve outside the expected
      management prefix (or fail to resolve) silently seeds the mPCC with
      wrong BMC and InfiniBand addresses for every affected node — plausible
      but wrong data that surfaces later as failed BMC control and
      mis-addressed interfaces, requiring manual database cleanup.
    regression_test: >
      test_import_rejects_non_mgmt_ip: run the derivation snippet with a node
      resolving to an IP outside the management prefix and assert the import
      is rejected with a message. Fails today — the BMC IP silently equals
      the management IP; passes with the post-substitution validation.

  - id: SCR-014
    type: bug
    severity: S3
    title: "Node import writes BMC credentials to world-readable temp file"
    user_value: null
    evidence:
      - path: tools/import_systems_csv.sh
        lines: 66-66
        excerpt: |
          echo -n "" > /tmp/mash_node_import
      - path: tools/import_systems_csv.sh
        lines: 84-94
        excerpt: |
          cat << EOF >> /tmp/mash_node_import

          print Creating System ${m_hostname}
          create systems.models.System hostname=${m_hostname} created_by=1 tmpfs_root_size=0 systemimage=${imageName} stateful=1 disks=['compute-state-lite']
          let nodeId = {{ MPROV_RESULT['id'] }}

          # add the nic
          create systems.models.NetworkInterface name=ens0 hostname=${m_hostname} ipaddress=${m_ipaddr} bootable=1 system={{nodeId}} mac='${m_macaddr}' network=${nodeNetId}

          # add the bmc
          create systems.models.SystemBMC system={{nodeId}} ipaddress=${bmcIp} username=${bmcUser} password=${bmcPass} network=${bmcNetId}
    repro: >
      The generated mash input, which contains every node's hostname, MAC,
      address and the BMC username and password variables, is accumulated in
      the fixed-name path /tmp/mash_node_import created with the default
      umask (world-readable when the root operator runs it, typically mode
      644), and the file is never deleted after the mash invocation at line
      104. A stale copy with the (operator-customised) BMC credential and
      full inventory persists in /tmp until reboot, readable by any local
      account on the host.
    fix_idea: >
      Create the accumulation file with restrictive permissions (or under a
      private temporary directory made with mktemp semantics) and remove it
      as soon as the mash run completes, including on failure paths.
    blast_radius: >
      Any local unprivileged user on the control-center host where the import
      runs can read the fleet inventory and BMC credentials for as long as
      the leftover file exists. Affects every bulk import; worst case is a
      complete fleet credential and layout disclosure when operators set a
      real password in the script variables.
    regression_test: >
      test_import_file_private_and_removed: run the import against a stub
      mash, then assert /tmp/mash_node_import either no longer exists or has
      mode 600 or tighter. Fails today — the file persists with default
      permissions; passes with restrictive creation and cleanup.

  - id: SCR-015
    type: enhancement
    severity: S3
    title: "Twelve shipped scripts missing from the mpcc_scripts manifest"
    user_value: "Operators cannot attach the shipped set_root_pw, setup_ssh and other scripts to systems in the control center because the manifest fixture omits them."
    evidence:
      - path: mpcc_scripts.yaml
        lines: 1-8
        excerpt: |
          - model: scripts.script
            pk: install_mprov_script_runner_sh
            fields: 
              slug: install_mprov_script_runner_sh
              name: Install the mProv Jobserver for Scipts/NADS
              filename: image-gen/install_mprov_script-runner.sh
              scriptType: image-gen
          - model: scripts.script
    repro: >
      The fixture is the source of the Script objects operators pick from in
      the control center. Comparing its filename entries against the tree
      shows twelve shipped files absent from the fixture:
      image-gen/install_yq.sh, image-gen/set_root_pw.sh,
      image-gen/setup_data_share_mount.sh, image-gen/setup_ssh.sh,
      post-boot/NetworkManager-1.40-COPR.sh, post-boot/add-cuda-to-path.sh,
      post-boot/ansible-playbooks/nvidia-fm-install.yaml,
      post-boot/disable-fw-on-compute-nodes.sh,
      post-boot/gpfs_mmsdrrestore.sh,
      post-boot/install_chrony_and_timesync.sh, post-boot/nads.sh and
      post-boot/slurm_enable_gpus.sh. No manifest entry points at a missing
      file (all twelve entries resolve to real files), so the drift is
      entirely in the unlisted direction.
    fix_idea: >
      Add manifest entries for the scripts that are meant to be operator
      selectable — at minimum the core image-build helpers (root password,
      SSH key, share mounts, yq installer) and the actively maintained
      post-boot scripts — and keep deliberately deprecated or site-specific
      scripts out on purpose, with that decision noted in the fixture.
    blast_radius: >
      Operators wanting root password or SSH key setup, GPU counting, chrony,
      firewall or GPFS restore scripts cannot use them through the normal
      control-center workflow; they must hand-load fixtures or copy scripts
      manually, which is exactly the drift this fixture exists to prevent.
    regression_test: >
      test_manifest_covers_selectable_scripts: compare the set of files under
      image-gen and post-boot with manifest filenames and assert that the
      only unlisted ones are entries on a documented exclusion list. Fails
      today with twelve unlisted files; passes once the fixture is updated.

  - id: SCR-016
    type: bug
    severity: S3
    title: "Hardcoded python3.8 site-packages path breaks Rocky 9 installs silently"
    user_value: null
    evidence:
      - path: image-gen/install_mprov_jobserver.sh
        lines: 35-35
        excerpt: |
          cp /usr/local/lib/python3.8/site-packages/mprov_jobserver/plugins/*.yaml /etc/mprov/plugins/
    repro: >
      The copy source assumes the jobserver package landed in the Python 3.8
      site-packages directory, which only holds on RHEL or Rocky 8. On Rocky
      9 (which this fleet explicitly targets — add-mitigations-off.sh line 4
      names Rocky Linux 9.6, and pip3 installs into that system's newer
      python tree) the source path does not exist, the cp fails, and without
      fail-fast handling the script continues and exits 0, leaving a jobserver
      config that includes a plugins directory holding none of the plugin
      configuration files.
    fix_idea: >
      Discover the installed package location rather than hardcoding the
      interpreter version (query the package metadata or expand the path
      against the actual python3 site-packages of the running interpreter),
      and fail the install script if the plugin files cannot be found.
    blast_radius: >
      Any node image built on Rocky 9 gets a jobserver installation whose
      plugin configs silently never copy; the failure surfaces only at
      runtime when the secondary jobserver comes up without its image-sync or
      webserver module configuration. All Rocky 9 deployments of the
      secondary jobserver script are affected.
    regression_test: >
      test_plugin_copy_locates_package_dynamically: run the script in a
      sandbox where the jobserver is installed under a newer python
      site-packages tree and assert the plugin yaml files land in
      /etc/mprov/plugins. Fails today — the hardcoded copy is a no-op with a
      failing cp; passes with dynamic discovery.

  - id: SCR-017
    type: enhancement
    severity: S3
    title: "No guard against repartitioning the running OS disk"
    user_value: "Prevents a stale or mis-assigned disk layout in the mPCC from destroying the running OS disk of a node during provisioning."
    evidence:
      - path: post-boot/localTempDisk.py
        lines: 127-128
        excerpt: |
          device = parted.getDevice(pdisk['diskname'])
          disk = parted.freshDisk(device, 'gpt' )
    repro: >
      buildDisks takes each disk name from the layout the mPCC returns for
      this system and immediately calls freshDisk on it, which creates a new
      empty partition table, destroying whatever partitions the device had.
      There is no validation between fetching the layout (line 209) and
      wiping (line 128): nothing checks that the target device is not the
      device the running system booted from, is not currently mounted, or
      plausibly matches the size recorded for it. A layout accidentally
      attached to the wrong system — or one containing the OS disk — is
      executed verbatim as root.
    fix_idea: >
      Before repartitioning, validate each target device: refuse to wipe the
      device backing the currently mounted root filesystem or any mounted
      partition, and optionally sanity-check device size or model against the
      layout record, requiring an explicit override to proceed.
    blast_radius: >
      The script's entire purpose is destructive, but today the only thing
      standing between a data mistake in the mPCC and the wipe of a live OS
      disk is the correctness of remote records. Worst case: one mis-assigned
      layout record destroys the boot disk of every system that picks it up.
    regression_test: >
      test_refuses_root_device_wipe: run buildDisks in a sandbox where the
      layout names the device currently mounted as root and assert the script
      refuses with a clear error instead of wiping. Fails today — the wipe
      proceeds; passes with the guard.

  - id: SCR-018
    type: bug
    severity: S4
    title: "Broken shebang in gpfs_mmsdrrestore.sh prevents direct execution"
    user_value: null
    evidence:
      - path: post-boot/gpfs_mmsdrrestore.sh
        lines: 1-4
        excerpt: |
          #/bin/bash
          GPFS_MGRNODE=mgmt03.ib.cluster
          /usr/lpp/mmfs/bin/mmsdrrestore -p $GPFS_MGRNODE
          /usr/lpp/mmfs/bin/mmstartup
    repro: >
      The first line reads slash-bin-bash preceded by a single hash (verified
      byte-for-byte) — a comment, not a shebang. Executing the file directly
      fails because the kernel finds no interpreter directive. It only works
      when a shell that falls back to interpreting non-executable-format
      files runs it, or when invoked as an explicit argument to bash; the
      jobserver's execution path happens to mask it. The script is also not
      in the manifest and hardcodes a cluster-specific manager hostname.
    fix_idea: >
      Correct the interpreter line to a proper hash-bang path, and consider
      taking the GPFS manager node from a parameter or the entity config
      instead of hardcoding one cluster's hostname.
    blast_radius: >
      Anyone running the script directly gets an exec format error and may
      assume GPFS restore ran when the invocation did nothing under some
      wrappers. No fleet-wide impact; annoyance and confusion for the
      operator who reuses this script.
    regression_test: >
      test_script_executes_directly: assert the file's first two bytes are
      the interpreter marker and that executing the file directly in a
      sandbox (with stubbed binaries) runs to completion. Fails today on both
      counts; passes after the fix.

  - id: SCR-019
    type: bug
    severity: S4
    title: "Error messages print literal placeholder instead of exception detail"
    user_value: null
    evidence:
      - path: post-boot/setupBMC.py
        lines: 44-46
        excerpt: |
          except Exception as e:
            print("Error: Unable to parse mPCC response. {e}")
            sys.exit(1)
      - path: post-boot/setupBMC.py
        lines: 57-59
        excerpt: |
          except Exception as e:
            print("Error: Unable to parse mPCC reply for BMC. {e}")
            return
    repro: >
      Both except blocks interpolate nothing: the brace-e placeholders are
      inside plain double-quoted strings with no formatting prefix, so the
      output is the literal characters inside braces and the captured
      exception detail is lost. The two failure branches report an error but
      give the operator no information about what the mPCC actually returned.
    fix_idea: >
      Make both messages interpolate the exception (formatted string or
      equivalent) so the parse failure reason is visible in the job output.
    blast_radius: >
      Any mPCC response that fails to parse produces an error line with no
      diagnostic content; debugging BMC setup failures requires reproducing
      the request by hand. No behavioural impact beyond log usefulness.
    regression_test: >
      test_parse_error_includes_exception: drive the parse branch with a
      malformed response and assert the printed error contains the underlying
      exception text. Fails today — output is the literal placeholder; passes
      after interpolation.

  - id: SCR-020
    type: enhancement
    severity: S4
    title: "Enable shellcheck for shell scripts in CI"
    user_value: "Catches quoting, unquoted-expansion and error-handling defects in these root-run shell scripts before they reach fleet nodes."
    evidence:
      - path: image-gen/extra_packages.sh
        lines: 15-16
        excerpt: |
          echo $pkgs
          dnf -y install $pkgs
    repro: >
      The repo has no CI at all (no .github directory in the tree) and its
      shell scripts contain numerous items a shellcheck pass would flag —
      unquoted expansions passed to dnf as shown, the unquoted empty-variable
      test at image-gen/run_ansible.sh line 20 (verified to emit a bash unary
      operator error when the variable is empty), unquoted command
      substitutions, and cd statements without failure handling throughout
      image-gen. These scripts run as root on every fleet node, so a static
      check is the cheapest available guard. This is the single lint-class
      filing allowed per repo by the review rules.
    fix_idea: >
      Add a CI workflow that runs shellcheck across all shell scripts in the
      repository (image-gen, post-boot, tools) and treats new findings as
      failures, ideally alongside a basic bash syntax gate.
    blast_radius: >
      Worst case is continued reliance on manual review for a class of
      defect (quoting and error handling in privileged scripts) that a
      linter mechanically detects; developer and reviewer annoyance only, no
      runtime impact from the check itself.
    regression_test: >
      test_ci_shellcheck_runs_on_scripts: push a change to a script
      containing a shellcheck-detectable quoting error and assert the CI
      workflow fails. Fails today — no CI exists so nothing blocks it; passes
      once the workflow gates merges.

  - id: SCR-021
    type: bug
    severity: S4
    title: "Rsync errors bypass the log file due to redirect order"
    user_value: null
    evidence:
      - path: tools/image-grab.sh
        lines: 67-71
        excerpt: |
          echo -n "Grabbing image $IMAGE_NAME from node $NODE (log: /tmp/$NODE-to-$IMAGE_NAME.log)..."
          rsync -avzx $EXCLUDE_DIRS --progress $DELETE root@$NODE:/ $IMAGE_DIR/$IMAGE_NAME/ 2>&1 >  /tmp/$NODE-to-$IMAGE_NAME.log

          # check the exit status of the rsync command
          if [ $? -ne 0 ]; then
    repro: >
      The redirect at line 68 is ordered wrongly: the stderr duplication
      sends stderr to the current stdout (the terminal) before the following
      redirect sends stdout alone into the log file. The log file the
      previous line advertises receives only stdout; rsync's error messages
      go to the terminal and are lost when the tool is run unattended. The
      status comparison at line 71 is also dead code because the fail-fast
      setting at line 6 aborts the script before it on any rsync failure.
    fix_idea: >
      Reverse the redirect order so stderr is merged after stdout is pointed
      at the log file (or use a single combined redirect), and remove or
      repurpose the unreachable status check made redundant by the fail-fast
      setting.
    blast_radius: >
      Operator debugging of failed image grabs must re-run with a terminal
      attached to see why rsync failed; the advertised log is incomplete. No
      effect on the transfer itself, whose failures still abort the script.
    regression_test: >
      test_stderr_captured_in_grab_log: run the grab command against an
      unreachable node and assert the log file contains the rsync error
      text. Fails today — the log has only stdout; passes with the corrected
      redirect order.
