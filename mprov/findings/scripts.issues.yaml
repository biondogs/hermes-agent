# R3 register — mprov_scripts comprehensive review (root-on-node scripts)
# Reviewed read-only at master @55bdd511e4c6912b0a6d44aefb22fc6e791e60d5.
# Cross-repo evidence cited in repro fields is from
# mprov_control_center @98d4579 (disklayouts/serializers.py) and
# mprov_jobserver @4f73fc1 (script_runner.py) local checkouts, both pinned
# in REVIEW-CHARTER.md; primary evidence is always inside mprov_scripts.
review:
  repo: mprov_scripts
  branch: master
  commit: 55bdd511e4c6912b0a6d44aefb22fc6e791e60d5
  reviewed_at: "2026-10-15"
  reviewer: sw-reviewer
  coverage:
    files_reviewed: 33
    files_total: 33
    method: full-tree

findings:
  - id: SCR-001
    type: bug
    severity: S2
    title: "Ansible loops never execute: over-escaped jq program is a compile error"
    user_value: null
    evidence:
      - path: image-gen/run_ansible.sh
        lines: 50-50
        excerpt: |
          for collection in `cat /tmp/mprov/entity.json | jq ".systemgroups[].ansiblecollections,.ansiblecollections[],.osdistro.ansiblecollections" | jq -s 'flatten(1)' | jq "select(.[].scriptType.slug|startswith(\\"$runMode\\"))" | jq -r '.[].collectionurl'`
      - path: image-gen/run_ansible.sh
        lines: 68-68
        excerpt: |
          for role in `cat /tmp/mprov/entity.json | jq ".systemgroups[].ansibleroles,.ansibleroles[],.osdistro.ansibleroles" | jq -s 'flatten(1)' | jq "select(.[].scriptType.slug|startswith(\\"$runMode\\"))" | jq -r '.[].roleurl'`
      - path: image-gen/run_ansible.sh
        lines: 101-101
        excerpt: |
          for playbook in `cat /tmp/mprov/entity.json | jq ".systemgroups[].ansibleplaybooks,.ansibleplaybooks[],.osdistro.ansibleplaybooks" | jq -s 'flatten(1)' | jq "select(.[].scriptType.slug|startswith(\\"$runMode\\"))" | jq -r '.[].filename'`
    repro: >
      The double-quoted jq programs contain triple backslash-escaped quotes.
      Inside double quotes the shell reduces each double backslash to one
      backslash and each backslash-quote to one quote, so jq receives
      startswith with a backslash before the opening quote. That is a jq
      syntax error, verified by execution: running the exact line 50 pipeline
      against a fixture entity.json prints "jq: error: syntax error,
      unexpected INVALID_CHARACTER ... 1 compile error" and emits no output,
      so the loop body never runs. The same escape appears at lines 68 and
      101. With the escaping reduced to a single backslash-quote the same
      pipeline returns the collection URL and the loop body executes
      (verified). Net effect: no ansible collection, role, or playbook
      referenced in the mPCC is ever installed, and the script still exits 0
      after wiping /tmp/mprov/ansible at line 119.
    fix_idea: >
      Fix the quoting in all three jq programs so jq receives a plain quoted
      string around the run mode value, e.g. by building the jq program in a
      variable with a single level of quote escaping, or by passing the run
      mode into jq as a command-line argument instead of string-interpolating
      it into the program text.
    blast_radius: >
      Every mProv deployment that attaches ansible collections, roles or
      playbooks to an image or system group silently gets none of them
      applied; the job reports success. Operators believe their ansible
      configuration ran on fleet nodes when nothing was installed, in every
      invocation of this script since the flawed pattern was introduced.
    regression_test: >
      test_run_ansible_jq_pipelines_produce_urls: execute the line 50, 68 and
      101 pipelines against a fixture entity.json containing one
      image-gen-marked collection, role and playbook and assert each pipeline
      prints the corresponding URL. Fails today with a jq compile error and
      empty output; passes once the quoting is corrected.

  - id: SCR-002
    type: bug
    severity: S2
    title: "Missing-key jq null literal bypasses guards and corrupts root config"
    user_value: null
    evidence:
      - path: image-gen/set_root_pw.sh
        lines: 7-13
        excerpt: |
          rootpw=`cat /tmp/mprov/entity.json | jq -r .config_params | jq -r .rootpw`
          if [ "$rootpw" == "" ]
          then
            echo "Error: No rootpw specified, exiting." >&2
            exit 1
      - path: image-gen/set_root_pw.sh
        lines: 19-19
        excerpt: |
          echo "root:${rootpw}:18700:0:99999:7:::" | cat - $TMPFILE  > /etc/shadow
      - path: image-gen/setup_ssh.sh
        lines: 7-14
        excerpt: |
          rootsshkey=`cat /tmp/mprov/entity.json | jq -r .config_params | jq -r .rootsshkey`
          if [ "$rootsshkey" == "" ]
          then
            echo "Error: No rootsshkey specified, exiting." >&2
            exit 1
          fi
      - path: image-gen/setup_ssh.sh
        lines: 19-21
        excerpt: |
          echo "$rootsshkey" > /root/.ssh/authorized_keys
          chmod 600 /root/.ssh/authorized_keys
          exit 0
      - path: post-boot/slurm_enable_gpus.sh
        lines: 6-11
        excerpt: |
          gpus=`cat /tmp/mprov/entity.json | jq -r .config_params | jq -r .gpus`
          if [ "$gpus" == "" ]
          then
            gpus=1
          fi
      - path: post-boot/slurm_enable_gpus.sh
        lines: 22-22
        excerpt: |
            echo "SLURM=\" --conf Gres=gpu:$gpus\"" >> /etc/sysconfig/slurmd
    repro: >
      jq -r prints the literal text null when a key is absent, not the empty
      string; the cited blocks contain blank source lines between the
      assignment and the guard, which the excerpt omits. Verified
      by execution: for entity.json with an existing config_params object
      that lacks the key, each of the three value retrievals (rootpw,
      rootsshkey, gpus) outputs null. The guards at set_root_pw.sh line 10,
      setup_ssh.sh line 10 and slurm_enable_gpus.sh line 8 only compare
      against the empty string, so they pass: set_root_pw writes a shadow
      line "root:null:..." (line 19), setup_ssh writes the text null into
      authorized_keys (line 19) and explicitly exits 0 (line 21), and
      slurm_enable_gpus appends Gres=gpu:null to the slurmd EnvironmentFile
      (line 22) instead of applying its intended default of 1.
    fix_idea: >
      Guard against both the empty string and the jq null literal, or better,
      use jq itself to detect absence (select the key, or compare against the
      jq null via jq type checks) so a missing key is distinguished from an
      empty value in all three scripts.
    blast_radius: >
      Provisioning a node whose config_params omit rootpw, rootsshkey or gpus
      — exactly the case these guards exist to catch — silently produces a
      root shadow entry with an invalid hash, an authorized_keys containing
      the text null, and a slurmd Gres count of null, while all three scripts
      report success. Worst case: a fleet of nodes reachable neither by SSH
      key nor by password, discovered only when operators try to log in.
    regression_test: >
      test_missing_key_guard_rejects_null: run each guard snippet with the
      retrieved value set to the jq output for a missing key (the literal
      null) and assert the script exits 1 with its "not specified" error.
      Fails today — the scripts continue and write the null value; passes
      after the guard treats null as missing.

  - id: SCR-003
    type: bug
    severity: S2
    title: "Disk formatter crashes mounting non-RAID partitions: disk-level mount is None"
    user_value: null
    evidence:
      - path: post-boot/localTempDisk.py
        lines: 147-149
        excerpt: |
          with open("/etc/fstab", "a") as fstab:
            fstab.write(f"UUID={partuuid}\t{part['mount']}\t\t{part['filesystem']}\tdefaults\t0 0\n")
          sh.mount([f"{pdisk['mount']}"])
    repro: >
      The fstab entry at line 148 is written for the partition mount point
      part['mount'], but line 149 mounts pdisk['mount'], the field nested at
      the disk-layout level. In the mPCC API the disk-level mount is produced
      by DiskLayoutAPISerializer.getMount (mprov_control_center
      disklayouts/serializers.py:38-43), which returns None for every disk
      whose dtype is not mdrd. The f-string therefore renders the text None
      and the script runs mount None, which cannot find the entry in fstab
      and exits nonzero; the python sh wrapper raises an uncaught
      ErrorReturnCode from buildDisks. The crash happens after /etc/fstab was
      already unlinked (line 118) and after the first partition filesystem
      was created, so a system with any partitioned non-RAID disk aborts
      mid-build with a partial fstab.
    fix_idea: >
      Mount the same mount point that was just written to fstab (the
      partition's mount field) rather than the disk-level field, or drop the
      explicit mount call entirely and leave mounting to the fstab entry.
    blast_radius: >
      Every system whose disk layout includes a non-RAID disk with a
      filesystem partition fails provisioning midway: partition created and
      mkfs run, then an unhandled traceback and exit before the remaining
      partitions, RAID devices, or fstab entries are built. Deployments whose
      layouts are RAID-only skip the path, which is likely why this has gone
      unnoticed.
    regression_test: >
      test_build_disks_mounts_partition_mountpoint: feed buildDisks a layout
      with one non-mdrd disk and one xfs partition and assert the mount
      argument equals the partition's mount field. Fails today with the
      disk-level None value and a crash; passes once the mount call uses the
      partition's mount point.

  - id: SCR-004
    type: bug
    severity: S2
    title: "RAID build crashes: member disk id compared against disk slug string"
    user_value: null
    evidence:
      - path: post-boot/localTempDisk.py
        lines: 170-182
        excerpt: |
          mdadm_cmd = f"--create {pdisk['diskname']} -R --force --level={pdisk['raidlevel']} --raid-devices={len(pdisk['members'])} "
          for member in pdisk['members']:
            # find our dev from the disklayouts.
            for sdisk in self.disklayout:
              if sdisk['slug'] == member['disklayout']:
                dev = sdisk['diskname']
            partOffset = 0

            member_part = f"{dev}{member['partnum'] + partOffset}"
            mdadm_cmd += f"{member_part} "
            # zero the superblock
            sh.mdadm(['--zero-superblock', f"{member_part}"])
            sh.wipefs(['--all', '--force', f"{member_part}"])
    repro: >
      Each RAID member record comes from the mPCC as a serialized
      DiskPartition whose disklayout field is a PrimaryKeyRelatedField
      (mprov_control_center disklayouts/serializers.py:6-11), i.e. an integer
      primary key. The lookup at line 174 compares that integer against
      sdisk['slug'], a string such as a layout slug name, so the equality can
      never hold, dev is never assigned, and the f-string at line 178 raises
      NameError (local variable dev referenced before assignment) on the very
      first member. buildRAIDs therefore always aborts; worse, buildDisks
      (which runs first, line 289) unlinked /etc/fstab at line 118 and skips
      all mdrd disks, so a RAID-only layout is left with no /etc/fstab at
      all when the crash hits.
    fix_idea: >
      Match the member's disklayout primary key against the same key on the
      disk entries (or have the API serialize the layout slug alongside the
      id and compare slug to slug), and fail with a clear error naming the
      unmatched member disk instead of relying on the NameError.
    blast_radius: >
      Every system whose disk layout contains a software RAID device fails
      provisioning: no RAID array is ever created, and because the fstab
      rebuild earlier in the same run already removed the file, the node
      boots with an empty or missing fstab. All mdrd-based deployments are
      affected on every run of this script.
    regression_test: >
      test_build_raids_matches_member_disklayout_by_id: feed the
      DiskLayoutAPISerializer output for a two-member RAID to buildRAIDs and
      assert the member device paths are computed from the correct disk
      names. Fails today with a NameError on the first member; passes once
      the member records are matched on the disk layout primary key.

  - id: SCR-005
    type: bug
    severity: S3
    title: "Unguarded cd before entity.json read leaves config variables empty"
    user_value: null
    evidence:
      - path: image-gen/install_mprov_jobserver.sh
        lines: 8-12
        excerpt: |
          cd /tmp/mprov

          # get some initial variables.
          mprovURL=`cat entity.json | jq .mprovURL -r`
          apikey=`cat entity.json | jq .apikey -r`
      - path: image-gen/install_mprov_script-runner.sh
        lines: 9-13
        excerpt: |
          cd /tmp/mprov

          # get some initial variables.
          mprovURL=`cat entity.json | jq .mprovURL -r`
          apikey=`cat entity.json | jq .apikey -r`
      - path: image-gen/setup_data_share_mount.sh
        lines: 2-10
        excerpt: |
          cd /tmp/mprov/
          mprovURL=`cat entity.json | jq .mprovURL -r`
          mpccHost=`echo "$mprovURL" | awk -F/ '{print $3}'`

          dnf -y install nfs-utils

          mkdir -p /data
          # Add bind mount to fstab
          grep -qF '/export/data' /etc/fstab || echo "${mpccHost}:/export/data    /data    nfs defaults    0 0" >> /etc/fstab
      - path: image-gen/setup_mprov_share_mount.sh
        lines: 2-10
        excerpt: |
          cd /tmp/mprov/
          mprovURL=`cat entity.json | jq .mprovURL -r`
          mpccHost=`echo "$mprovURL" | awk -F/ '{print $3}'`

          dnf -y install nfs-utils

          mkdir -p /opt/mprov
          # Add bind mount to fstab
          grep -qF '/export/mprov' /etc/fstab || echo "${mpccHost}:/export/mprov    /opt/mprov    nfs defaults    0 0" >> /etc/fstab
    repro: >
      None of the four scripts guard the cd: if /tmp/mprov is absent or the
      cd fails for any reason, the shell stays in the previous directory,
      every relative cat entity.json fails, and command substitution yields
      an empty string rather than an error. mprovURL, apikey and mpccHost are
      then empty: the two install scripts write jobserver and script-runner
      YAML files with an empty mprovURL and apikey, and the two mount scripts
      append an fstab NFS line with an empty server that no mount can ever
      resolve. There is no fail-fast error handling in any of the four, so
      nothing stops the writes and all four exit 0.
    fix_idea: >
      Make each script exit with a clear error when the cd fails or
      entity.json is unreadable, before any config file or fstab line is
      written; validate that the scraped values are non-empty as well.
    blast_radius: >
      Any provisioning run where the script working directory or entity file
      is missing (failed jobserver download, environment mismatch) silently
      produces persistently broken node state: an fstab NFS entry with an
      empty server that delays every subsequent boot, and jobserver configs
      with empty endpoint and credentials. Worst case is a fleet of nodes
      with unremovable broken fstab lines.
    regression_test: >
      test_cd_failure_aborts_before_writes: run each of the four scripts in
      a sandbox where /tmp/mprov does not exist (or entity.json is absent)
      and assert that no fstab line is appended and no config file is
      written, and that the script exits nonzero. Fails today — the writes
      happen and the scripts exit 0; passes once the guard is added.

  - id: SCR-006
    type: bug
    severity: S3
    title: "Service install scripts continue after failed commands and report success"
    user_value: null
    evidence:
      - path: image-gen/create_slurm_client_service.sh
        lines: 4-7
        excerpt: |
          useradd -u 449 munge

          # add a slurm user
          useradd -u 450 slurm
      - path: image-gen/create_slurm_client_service.sh
        lines: 94-95
        excerpt: |
          systemctl enable slurmd
          systemctl start slurmd
      - path: image-gen/create_slurm_client_service.sh
        lines: 116-117
        excerpt: |
          systemctl enable munge
          systemctl start munge
      - path: post-boot/enable_and_run_jobserver.sh
        lines: 2-5
        excerpt: |
          systemctl enable mprov-jobserver
          systemctl start mprov-jobserver
          firewall-cmd --zone=public --add-port=8080/tcp --permanent
          firewall-cmd --reload
    repro: >
      Neither script uses fail-fast error handling or checks any exit status,
      so a failure at any step is carried forward. In
      create_slurm_client_service.sh, if the dnf install at line 10 fails (or
      the non-idempotent useradd calls at lines 4 and 7 fail on re-run because
      the ids already exist), the script still creates the systemd units,
      enables and starts slurmd at lines 94-95, then enables and starts munge
      at lines 116-117. When the final systemctl start munge succeeds, the
      script exits 0 and the whole run reads as successful despite a broken
      slurm/munge stack. enable_and_run_jobserver.sh likewise proceeds past
      failed enable or start of the jobserver; its exit status is whatever
      firewall-cmd --reload last returned, masking the service failures.
    fix_idea: >
      Enable fail-fast error handling in both scripts, or check the status of
      each critical command and abort with a message naming the failed step;
      make the useradd calls idempotent so re-runs do not turn into silent
      mid-script failures.
    blast_radius: >
      Any transient dnf or systemctl failure during image build or
      re-provision leaves a half-configured slurm client (missing packages,
      dead slurmd) or an unstarted jobserver that the pipeline records as
      success. Operators find out only when the node joins the cluster
      misbehaving.
    regression_test: >
      test_service_script_fails_loud_on_dnf_error: run
      create_slurm_client_service.sh in a sandbox where the dnf install
      command fails and assert the script exits nonzero before touching
      systemd units. Fails today — the script runs to completion and exits 0;
      passes once fail-fast handling is in place.

  - id: SCR-007
    type: bug
    severity: S3
    title: "Root fstab file deleted before rebuild with no failure isolation"
    user_value: null
    evidence:
      - path: post-boot/localTempDisk.py
        lines: 116-121
        excerpt: |
          sh.mdadm(['--stop', '--scan'])
          try:
            os.unlink("/etc/fstab")
          except:
            pass
          partnum=1
    repro: >
      buildDisks deletes /etc/fstab at line 118 before any partition or
      filesystem has been built, then re-creates its content incrementally
      with append-mode writes (lines 147, 159, 192). Any failure after the
      unlink — a missing device at parted.getDevice, a mkfs or mdadm error,
      or the crashes described in SCR-003 and SCR-004 — leaves the node with
      a truncated or entirely missing fstab, because nothing ever restores
      the previous content. The bare except at lines 119-120 also swallows
      unrelated unlink errors.
    fix_idea: >
      Build the new fstab content in a temporary file during the run and
      atomically replace /etc/fstab only after all disks, filesystems and
      RAID devices have been created successfully; keep a backup copy to
      restore on failure. Narrow the exception handling around the unlink.
    blast_radius: >
      Every failed localTempDisk run (several independent crash paths exist
      in this script) leaves the node without a valid fstab — persistent root
      and swap entries gone — turning a recoverable provisioning error into a
      node that boots broken. Affects every mdrd or partitioned-disk
      deployment whose build fails for any reason.
    regression_test: >
      test_failed_run_preserves_original_fstab: seed a sandbox fstab, drive
      buildDisks with a layout that raises mid-run (bad diskname), and assert
      /etc/fstab still contains the original content afterwards. Fails today
      — the file is gone or partial; passes with the build-then-swap scheme.

  - id: SCR-008
    type: bug
    severity: S3
    title: "Fill-partition handling reads stale loop variable for filesystem checks"
    user_value: null
    evidence:
      - path: post-boot/localTempDisk.py
        lines: 153-157
        excerpt: |
          if fillpart is not None:
            self._createPartition(device, disk, fillpart, sectorsize, start)

            if part['filesystem'] != 'raid' and part['mount'] != 'raid':
              partuuid = self._makeFS(fillpart, pdisk)
    repro: >
      After the partition loop (lines 135-151) finishes, the variable part
      still holds the last iterated partition, but the fill-partition block
      tests part's filesystem and mount fields at line 156 while all other
      statements in the block operate on fillpart. Whenever the fill
      partition is not the last entry of the sorted list (its partnum is
      lower than another partition's), the decision to build the fill
      partition's filesystem is made from an unrelated partition's fields: a
      fill partition typed raid can be mkfs'd over (corrupting a RAID
      member), or a normal fill partition can be skipped, leaving it without
      a filesystem or fstab entry.
    fix_idea: >
      Evaluate the same fields on fillpart that the block then passes to the
      filesystem builder, so the fill partition's own type decides whether it
      gets a filesystem.
    blast_radius: >
      Any disk layout whose grow-to-fill partition is not the
      highest-numbered partition on its disk gets the wrong behavior,
      silently — either a missing filesystem on the fill partition or a
      filesystem written over a partition that was meant to be a RAID member.
      Only layouts that happen to sort the fill partition last work.
    regression_test: >
      test_fill_partition_uses_own_fields: feed buildDisks a partition list
      where a non-fill partition sorts after the fill partition and the fill
      partition is typed raid; assert the filesystem builder is not called
      for it. Fails today because the stale variable's non-raid values
      authorise the call; passes after the fix.

  - id: SCR-009
    type: bug
    severity: S3
    title: "BMC password passed on ipmitool command line is visible in process list"
    user_value: null
    evidence:
      - path: post-boot/setupBMC.py
        lines: 101-111
        excerpt: |
          result = subprocess.run(["/usr/bin/ipmitool", "user", "set", "name", "2", f"{bmc['username']}"])
          if result.returncode:
            print(result.stdout)
            print(result.stderr)
            return

          result = subprocess.run(["/usr/bin/ipmitool", "user", "set", "password", "2", f"{bmc['password']}"])
          if result.returncode:
            print(result.stdout)
            print(result.stderr)
            return
    repro: >
      Line 107 spawns ipmitool with the BMC password as a command-line
      argument. For the lifetime of the process any local observer can read
      it from the process argument listings of the ipmitool child and of this
      python parent. ipmitool prompts for the password on its terminal when
      the argument is omitted, so the value can be supplied through standard
      input instead of the argument list.
    fix_idea: >
      Supply the password via stdin by invoking the interactive prompt form
      of the ipmitool user set password command, or another channel that does
      not place the secret in the process argument list; ensure it is never
      printed in logs either.
    blast_radius: >
      The BMC credential for every node transits through a world-readable
      process argument during provisioning. Post-boot runs normally happen
      before users can log in, but any re-run of BMC setup on a live
      multi-user node (script re-invocation, debugging) exposes the fleet BMC
      password to every local user and any process-monitoring agent for the
      command's duration; BMC control implies power and console control of
      the node.
    regression_test: >
      test_bmc_password_not_in_argv: run the BMC setup against a stub ipmitool
      that records its arguments, and assert the password value never appears
      in any spawned process argument list. Fails today — the argument list
      contains it; passes when fed via stdin.

  - id: SCR-010
    type: bug
    severity: S3
    title: "BMC setup crashes with NameError when systembmcs request fails"
    user_value: null
    evidence:
      - path: post-boot/setupBMC.py
        lines: 118-120
        excerpt: |
          else:
            print(f"Error: Unable to get bmc info, {response.status_code}: {response.text}")
      - path: post-boot/setupBMC.py
        lines: 129-134
        excerpt: |
          data = {
            "id": bmc['id'],
            "mac": bmcMac,
            "ipv6ll": bmcLL,
          }
          response = self.session.patch(f"{self.mprovURL}systembmcs/{bmc['id']}/", data=json.dumps(data))
    repro: >
      The variable bmc is only bound inside the status-code-200 branch (line
      53). When the systembmcs request returns any other status, the else at
      line 118 only prints an error and falls through to the MAC collection
      block at line 121, which runs unconditionally; if ipmitool reports a
      MAC address, line 130 dereferences bmc's id field and raises NameError
      on an unbound name, aborting the script with a raw traceback instead of
      a clean error exit.
    fix_idea: >
      Return (or exit nonzero) from the non-200 branch after reporting the
      error, so the MAC-registration block cannot run without a BMC record in
      hand.
    blast_radius: >
      Every node whose BMC record cannot be fetched from the mPCC (missing
      SystemBMC row, permission or connectivity error) ends post-boot with a
      Python traceback; the run's outcome is a crash rather than a
      diagnosable failure. Only occurs on the error path, but that path is
      the one that needs the cleanest behaviour.
    regression_test: >
      test_failed_bmc_fetch_exits_cleanly: stub the session to return a
      non-200 for the systembmcs query with ipmitool available, and assert
      the script exits nonzero with the printed error and no traceback. Fails
      today with NameError; passes with the early return.

