      Fails today when the decoy matches first, passes after.

  - id: JS-024
    type: bug
    severity: S3
    title: "Fix handler attribute reference that breaks high-load shedding in the webserver"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/plugins/mprov_webserver.py
        lines: 50-54
        excerpt: |
          def do_GET(self):
            print(mProvHTTPReqestHandler.connCount)

            if os.getloadavg()[1] >= multiprocessing.cpu_count() \
                and self.js.config_data['loadmon']\
                and self.path.startswith("/images/"):
    repro: >
      The request handler accesses a js attribute on itself, but only the server
      instance carries the jobserver reference (the sibling method in the same
      file correctly reaches through self.server for it). On an idle host the
      first operand of the chain is false so the broken reference is never
      touched, which is why serving works at all. The moment the five-minute load
      reaches the CPU count, the exact condition this shedding logic exists for,
      every image request raises AttributeError inside the handler thread and the
      connection is dropped mid-response instead of the intended clean refusal
      with an error status.
    fix_idea: >
      Reach the jobserver reference through the server instance as the size check
      in the same class already does, read the load monitor toggle through the
      mapped attribute rather than the raw config map (see the loadmon finding),
      and add a unit test that exercises the shed path under a forced load value.
    blast_radius: >
      Image serving under load degrades from a designed, communicated refusal
      with retry semantics into abrupt connection resets for every imaging client
      at the worst possible time (precisely when the host is busy), producing
      retry storms and confusing PXE failures across concurrently provisioning
      nodes.
    regression_test: >
      test_high_load_returns_clean_error: force the load probe above the CPU
      count in a handler unit test with a mock server carrying the jobserver
      reference and assert the response is the intended error status rather than
      an exception. Fails today, passes after.

  - id: JS-025
    type: bug
    severity: S3
    title: "Clean up image build bind mounts on failure and before archiving"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/templates/image-update/script-runner.sh
        lines: 7-10
        excerpt: |
          for i in `echo "dev proc run sys"`
          do
            mount -o bind /$i ${IMGDIR}/${i}
          done
      - path: src/mprov_jobserver/plugins/image_update.py
        lines: 379-380
        excerpt: |
          os.system('rm -f ' + imgDir + '/' + imageDetails['slug'] + '.img')
          if os.system('/tmp/busybox tar c -C' + imgDir + ' -f - ./ | gzip -1 -c > /tmp/' + imageDetails['slug'] + '.img'):
    repro: >
      The generated build script bind-mounts the host dev, proc, run, and sys
      trees into the image directory and unmounts them only in the tail of a
      successful flow, with no trap or error handling. If the chrooted run fails
      out of band, or the daemon is stopped mid-build (an ordinary systemctl
      restart during a long build), the mounts persist. The next pass for that
      image tars the image directory with those live host trees still mounted
      under it, so the tar walks host proc and dev contents into the image archive
      or hangs, and stale mounts also interfere with the following build's own
      mount and chroot steps.
    fix_idea: >
      Register an exit trap in the generated script that unmounts all four binds
      whenever the script ends for any reason, have the build code verify the
      image tree is mount-free before archiving, and lazily unmount leftovers at
      the start of each image build pass.
    blast_radius: >
      Builds interrupted by restarts or crashes poison the next build of the same
      image: worst case a shipped image containing host device and process files,
      more commonly a wedged build step or a tar that never completes, blocking
      the image-update lane for that image until someone inspects mounts manually.
    regression_test: >
      test_interrupted_build_leaves_no_mounts: start a build that mounts the
      bindings and is killed before the unmount phase, then run the next build
      pass and assert it detects and clears the leftovers before tarring. Fails
      today, passes after.

  - id: JS-026
    type: bug
    severity: S3
    title: "Stop interpolating mPCC-sourced values into shell command strings"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/plugins/image_update_mod/rhel.py
        lines: 35-35
        excerpt: |
          cmd=f"chroot {imgDir} dracut --regenerate-all -f --mdadmconf --force-add mdraid --add-drivers sd_mod --add-drivers \"{self.imageDetails['osdistro']['initial_mods'].replace(',',' ')}\""
      - path: src/mprov_jobserver/plugins/repo_update_mod/rhel.py
        lines: 51-51
        excerpt: |
          if os.system(f"dnf reposync --repofrompath {self.repo['id']},\"{self.repo['repo_package_url']}\" --repo {self.repo['id']} --destdir=./ --download-metadata --installroot={self.repoDir}/{self.repo['id']}"):
    repro: >
      Build commands are assembled by f-string interpolation into a single string
      handed to the shell. The distro initial drivers list and the repo id and
      package URL come from mPCC database records edited through the control
      center API. Any of these values containing shell metacharacters (a double
      quote in the drivers field, or a crafted or merely malformed URL recorded in
      a repo) is executed as part of the root command on the build host. The
      injection crosses the trust boundary only as far as the mPCC permission
      model separates record editing from root script authorship, but the
      constructed commands also break on legitimate values containing spaces or
      quotes, which is a functional failure mode on its own.
    fix_idea: >
      Invoke these commands through the subprocess argument-list form with no
      shell, passing mPCC-sourced values as single arguments, which both removes
      the execution hazard and makes odd-but-legitimate values work. Apply the
      same pattern to the dracut call in the boot-files update path.
    blast_radius: >
      Any mPCC user permitted to edit distro module lists or repo records can
      achieve root command execution on image-build jobservers; on the
      non-adversarial side, values with ordinary special characters crash builds
      with shell syntax errors attributed to the wrong fixpoint.
    regression_test: >
      test_shell_metacharacters_in_repo_url_are_inert: run the repo update module
      against a mock repo record whose URL contains quote and semicolon characters
      and assert the reposync receives the URL verbatim as a single argument with
      nothing executed. Fails today, passes after.

  - id: JS-027
    type: bug
    severity: S3
    title: "Close the file descriptor opened for connection-limit size checks"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/plugins/mprov_webserver.py
        lines: 28-34
        excerpt: |
          try:
            f = open(path, 'rb')
          except OSError:
            self.send_error(HTTPStatus.NOT_FOUND, "File not found, unable to open")
            return False
          try:
            fs = os.fstat(f.fileno())
      - path: src/mprov_jobserver/plugins/mprov_webserver.py
        lines: 42-46
        excerpt: |
          except:
            f.close()
            print("Exception")
            raise
          return True
    repro: >
      On every image request the size check opens the target file to stat it and
      returns success without closing it; the close statement lives only inside
      the exception branch. Each served image GET therefore leaks one open
      descriptor in the daemon process for its lifetime. With the shipped default
      unit and typical descriptor limits around a thousand, an image-serving
      jobserver exhausts its file descriptors after roughly a thousand image
      fetches, after which image requests fail at open and, because the descriptor
      table is process-wide, so can file operations in every other plugin thread.
    fix_idea: >
      Stat the path without holding a descriptor, or open within a context
      management pattern that guarantees closure on every return path including
      the early size-limit refusal, and add a descriptor-count assertion to the
      serving tests.
    blast_radius: >
      Every image-source jobserver predictably degrades into failing all image
      requests after cumulative fetches reach the descriptor limit, usually
      quietly during a mass reprovisioning campaign when many nodes image at once,
      and recovery requires a daemon restart that also interrupts any in-flight
      builds.
    regression_test: >
      test_no_descriptor_leak_per_request: serve one image fixture a few hundred
      times through the handler and assert the process open-descriptor count is
      unchanged from start to end. Fails today with the count rising per request,
      passes after.

  - id: JS-028
    type: bug
    severity: S3
    title: "Send job timestamps in UTC as the code intends"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/app.py
        lines: 211-218
        excerpt: |
          if(status == 2) :
            # we use UTC here because django in the mPCC will interpret that correctly.
            # setting the job to running
            data['start_time'] = datetime.now().strftime("%Y-%m-%dT%H:%M:%S")
            data['end_time'] = None
          elif(status == 3) or (status == 4) :
            # job failed
            data['end_time'] = datetime.now().strftime("%Y-%m-%dT%H:%M:%S")
    repro: >
      The comment states the times are UTC for correct Django interpretation, but
      the code calls the local-clock now() and formats it without a timezone
      offset, producing a naive local-time string. On any jobserver whose timezone
      is not UTC, job start and end times are recorded shifted by the local
      offset, so durations computed by the mPCC are wrong by hours, and jobservers
      in different timezones on one deployment produce mutually inconsistent
      timestamps for the same queue.
    fix_idea: >
      Use the timezone-aware UTC clock accessor that is already imported in the
      module and render it into the format the mPCC expects, keeping one explicit
      convention (UTC with offset or naive UTC) documented in both repos.
    blast_radius: >
      Every job start and end time on non-UTC jobservers is silently wrong in the
      mPCC database, skewing provisioning-duration reporting and any timing
      analysis operators do. Worst case on a fleet spanning timezones: durations
      appear negative or wildly inflated.
    regression_test: >
      test_job_timestamps_are_utc: with the process timezone set to a known
      non-UTC zone, run the status update against a mock mPCC and assert the
      posted timestamps equal the UTC clock within a tolerance. Fails today,
      passes after.

  - id: JS-029
    type: bug
    severity: S4
    title: "Include the promised genders.include file in generated genders output"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/plugins/libgenders.py
        lines: 59-63
        excerpt: |
          # This genders file is maintained by mProv.
          # if you would like entries included in this file
          # create an /etc/genders.include file and put them
          # there.  They will be added to the end of this file.
    repro: >
      The header that the generator writes into every genders file instructs
      operators to place extra entries in an include file and promises they will
      be appended to the end of the generated file. No code path reads that
      include file; the writer only emits the node lines and never concatenates
      anything. Operators who follow the documented mechanism get silently
      dropped entries and pdsh selections that miss their custom groups.
    fix_idea: >
      Honor the documented contract by appending the include file contents at the
      end of the generated output when it exists, or, if the include mechanism is
      deliberately unimplemented, change the generated header text so it stops
      promising the behavior.
    blast_radius: >
      Operators who follow the instructions inside the generated file lose their
      custom genders entries on every regeneration without error, message, or
      trace. Worst case is quiet omission of node attributes used by cluster
      tooling.
    regression_test: >
      test_genders_include_is_appended: place a fixture include file at the
      configured path, run the libgenders job, and assert the generated file ends
      with the include contents. Fails today, passes after.

  - id: JS-030
    type: enhancement
    severity: S4
    title: "Enable flake8 and shellcheck lint gates in CI"
    user_value: >-
      Lint gates in CI catch undefined names, accidental identity comparisons,
      and shell quoting slips before release instead of as production incidents.
    evidence:
      - path: src/mprov_jobserver/plugins/image_update.py
        lines: 111-111
        excerpt: |
          if imageData['customIPXE'] is not "" and imageData['customIPXE'] is not None:
      - path: src/mprov_jobserver/plugins/dnsmasq.py
        lines: 1-1
        excerpt: |
          from distutils.command.build import build
      - path: repack_image
        lines: 5-6
        excerpt: |
          rm $1/`basename $1`.img -f
          busybox tar c -C $1-f - ./ | gzip -1 -c > /tmp/`basename $1`.img
    repro: >
      Multiple findings in this register (an undefined variable in an image-update
      error path, an undefined attribute in repo-update error handlers, an
      unquoted shell path in the repack script) are exactly the defect classes
      that a standard lint gate flags mechanically, and this release shipped them
      to users. The identity comparison against a string literal at
      image_update.py line 111 currently works only by reliance on CPython string
      interning and is flagged by stock flake8; the unused disttools import at
      dnsmasq.py line 1 would break outright on Python 3.12, which the package
      metadata nevertheless claims to support.
    fix_idea: >
      Add a CI step running flake8 on the package sources and shellcheck on the
      shell scripts and generated templates, start with a ruleset limited to
      error-class findings so the gate is actionable, and fix or explicitly ignore
      the existing hits, including the two examples cited as evidence.
    blast_radius: >
      No direct behavioral risk; this is the single hygiene allowance for lint
      coverage. Its absence is the shared root cause that let several registered
      defects ship.
    regression_test: >
      test_ci_lint_gate_present: CI configuration includes a flake8 step over the
      package and a shellcheck step over shell scripts, and both steps fail the
      build on the error classes cited above when reintroduced.
