      entire process. In a piped script the remaining lines ('print still-alive' in
      the probe) never execute; interactively all session variables are lost.
    fix_idea: >
      Reject the argument at the command level with a usage error instead of exiting
      the process; then support the type or name the supported types in help.
    blast_radius: >
      One dict-style argument — an easy mistake given JSON-ish values are accepted for
      lists in the same parser — discards an entire interactive session's state or
      aborts the rest of a script.
    regression_test: >
      test_dict_arg_rejected_without_exit: pass a dict-typed value to create and
      assert the shell survives with an error on that command only; fails today with
      the process exiting, passes after the fix.

  - id: MASH-016
    type: bug
    severity: S3
    title: "Unparseable query tokens are silently swallowed and sent anyway"
    user_value: null
    evidence:
      - path: src/mash/app.py
        lines: 546-554
        excerpt: |
          for marg in model_args.split(" "):
            try:
              key, value = marg.split('=',1)
              if key == 'id' or key == 'pk':
                # we got an id, so add it to the URL
                idStr=f"{value}/"
            except:
              pass
              queryString += f"{marg}&"
    repro: >
      For get/delete, each query token is split on '=' inside a try; a token without
      '=' raises and is ignored by the bare except, but execution falls through to the
      append line below the except, so the unparseable token is concatenated into the
      query string verbatim. Verified by execution: 'retrieve <model> garbage foo=bar'
      produced no error or warning and issued a request whose query string contains
      'garbage&foo=bar&'. A typo like 'hostnam=node1' is likewise passed through
      unvalidated, and the server decides what happens — possibly returning an
      unfiltered result set.
    fix_idea: >
      Validate that every query token has the key=value shape and that the key is a
      known model field before building the string; reject the command with a usage
      error naming the bad token instead of a silent bare-except.
    blast_radius: >
      Query typos produce server-dependent behavior with no client-side warning —
      wrong or over-broad result sets that look plausible, e.g. an unfiltered retrieve
      feeding a destructive foreach.
    regression_test: >
      test_bad_query_token_rejected: run retrieve with a token lacking '=' and one
      with an unknown field name, assert a usage error and no request is made; fails
      today sending the garbage query silently, passes after the fix.

  - id: MASH-017
    type: bug
    severity: S3
    title: "Trailing ampersand on bmc commands silently disables the command"
    user_value: null
    evidence:
      - path: src/mash/plugins/bmc.py
        lines: 52-56
        excerpt: |
          def precmd(self, line: str) -> str:
            if line[-1] == "&":
              line = line[:-1]
              self.background = True
            return line
      - path: src/mash/app.py
        lines: 105-105
        excerpt: |
          pluginInstance.onecmd(args)
    repro: >
      Plugins are invoked with pluginInstance.onecmd (app.py:105), which never calls
      the plugin's precmd — so the ampersand-handling block is dead code, and
      self.background (bmc.py:7) is never consulted by do_power. Following mash's own
      backgrounding convention ('create ... &' works on CRUD verbs), 'bmc power cycle
      node1&' passes 'node1&' to rangeToList, producing hostname 'node1&' in the
      request; the control center's hostname match then matches nothing and the
      response — 404 included — is discarded (MASH-004), so the power command is a
      total silent no-op.
    fix_idea: >
      Handle the trailing ampersand where the line actually enters the plugin (in the
      dispatch path or at the top of do_power), strip it before parsing the node spec,
      and honor the background flag the same way the CRUD verbs do.
    blast_radius: >
      Operators who use mash's own '&' convention on the most dangerous verb get a
      silent no-op: nodes believed power-cycled or powered off are untouched while the
      operator proceeds on that assumption.
    regression_test: >
      test_bmc_trailing_amp_backgrounds_and_still_runs: run 'bmc power on node1&'
      against a stub and assert the request carries hostname=node1 (strip verified)
      and the command reports or backgrounds per convention; fails today by sending
      hostname=node1& and doing nothing, passes after the fix.

  - id: MASH-018
    type: bug
    severity: S4
    title: "Connect silently ignores non-200 responses from the control center"
    user_value: null
    evidence:
      - path: src/mash/app.py
        lines: 466-468
        excerpt: |
          if response.status_code==200:
            # we connected, get the supported data models.
            self._getMPCCModels()
    repro: >
      Verified by execution against a mock whose root URL returns 403 while datamodel
      endpoints would succeed: 'connect URL apikey KEY' prints absolutely nothing
      (there is no else branch), no models are loaded, and the next verb fails with
      'Error: Unknown Model ...' — an error pointing at the model name, not at the
      failed connect.
    fix_idea: >
      Add an else branch reporting the non-200 status (and response body) as a
      connection failure so the operator knows connect itself failed.
    blast_radius: >
      Misleading silence on any control-center front-end that does not answer 200 at
      the root (reverse proxy, auth wall, redirect-not-followed, maintenance page);
      user then chases phantom "unknown model" errors.
    regression_test: >
      test_connect_reports_non_200: connect against a stub returning 403 and assert an
      error mentioning the connect failure; fails today with no output, passes after
      the fix.

  - id: MASH-019
    type: bug
    severity: S4
    title: "Connect help documents the wrong config file paths"
    user_value: null
    evidence:
      - path: src/mash/app.py
        lines: 173-174
        excerpt: |
          connect - With no arguments, mash will try to read the .mprov-mash.yaml file in the user's 
          home directory (~/.mprov-mash.yaml) and then try to read /etc/mprov/mprov-mash.yaml
    repro: >
      'help connect' tells users the no-argument connect reads ~/.mprov-mash.yaml and
      /etc/mprov/mprov-mash.yaml. The code (load_config, lines 61-64) actually reads
      /etc/mprov/mash.yaml, then /etc/mprov/jobserver.yaml, then ~/.mprov-mash.yaml. An
      operator who creates /etc/mprov/mprov-mash.yaml per the help text gets the
      "Unable to find working config file" error with no hint why.
    fix_idea: >
      Update the docstring to list the real search order and shapes (also covering
      MASH-013's schema), or change the code to the documented paths — whichever is
      the intended behavior.
    blast_radius: >
      Operator time wasted creating config files at paths mash never reads; worst case
      is confusion, corrected by reading the source.
    regression_test: >
      test_help_connect_matches_config_search_order: render 'help connect' and assert
      every documented path appears in load_config's search list; fails today on the
      two wrong paths, passes after docstring and code agree.

  - id: MASH-020
    type: bug
    severity: S4
    title: "Dead exception handler is defined but never installed"
    user_value: null
    evidence:
      - path: src/mash/app.py
        lines: 14-15
        excerpt: |
          def exception_handler(exc_type, exc_value, exc_traceback):
            print(f"There was an internal exception. {exc_value}", file=sys.stderr)
    repro: >
      exception_handler is defined at module scope but sys.excepthook is never
      assigned to it anywhere in the tree (no reference to excepthook exists in
      main.py or app.py). All the traceback-style crashes in MASH-007 print full
      multi-line tracebacks, showing the handler is not active. Dead code also invites
      a maintainer to assume friendly error messages exist when they do not.
    fix_idea: >
      Either install the handler on sys.excepthook in main() — which would turn
      uncaught crashes into the intended single-line message (consider printing the
      exception type too) — or delete the function.
    blast_radius: >
      No runtime effect today; developer/reviewer confusion about intended error
      presentation, and raw tracebacks (MASH-007) reach end users contrary to the
      apparent design intent.
    regression_test: >
      test_excepthook_installed_or_removed: if the handler stays, assert
      sys.excepthook is exception_handler after startup; if removed, assert no such
      symbol remains. Fails today on the first branch, passes after either fix.

  - id: MASH-021
    type: bug
    severity: S4
    title: "Changelog generator links to the mprov_jobserver repository"
    user_value: null
    evidence:
      - path: gen_changelog.sh
        lines: 11-11
        excerpt: |
          git log ${current_tag}...${previous_tag} --pretty=format:'*  %s [View](https://github.com/mprov-ng/mprov_jobserver/commit/%H)' --reverse | grep -v Merge
      - path: gen_changelog.sh
        lines: 16-16
        excerpt: |
          git log ${current_tag} --pretty=format:'*  %s [View](https://github.com/mprov-ng/mprov_jobserver/commit/%H)' --reverse | grep -v Merge
    repro: >
      Run 'gen_changelog.sh v0.0.8 v0.0.9' in the mash repo: the emitted markdown
      links every commit to github.com/mprov-ng/mprov_jobserver/commit/... — the wrong
      repository (copy-paste from the jobserver repo); every View link in the
      generated changelog 404s.
    fix_idea: >
      Point the format strings at the mash repository (or derive the repo slug from
      the git remote so the script is portable across the four mProv repos).
    blast_radius: >
      Wrong or dead links in generated release notes; annoyance only.
    regression_test: >
      test_changelog_links_target_this_repo: run the generator and assert emitted URLs
      reference mprov-ng/mash; fails today with jobserver URLs, passes after the fix.

  - id: MASH-022
    type: bug
    severity: S4
    title: "Bmc power help omits pxe and pxeefi actions supported by the server"
    user_value: null
    evidence:
      - path: src/mash/plugins/bmc.py
        lines: 32-32
        excerpt: |
          action:  One of 'on', 'off', 'cycle', or 'reset'
    repro: >
      'help bmc power' lists only on/off/cycle/reset. The control center's power
      endpoint (mprov_control_center @98d4579, systems/views.py SystemPowerAPIView
      and _doPowerCmd) also implements 'pxe' and 'pxeefi' boot-target actions — and
      mash passes the action token through verbatim, so 'bmc power pxe node01'
      actually works. Because list-style help is the only documentation, operators
      will not discover network-boot power control exists.
    fix_idea: >
      Update the docstring's action list to match the server's supported set, or
      derive the advertised actions from a constant shared with the API contract when
      one exists.
    blast_radius: >
      Feature hidden from users; no behavioral risk since arbitrary actions pass
      through unvalidated either way.
    regression_test: >
      test_bmc_power_help_lists_server_actions: render 'help bmc power' and assert it
      includes pxe and pxeefi; fails today, passes after the docstring change.

  - id: MASH-023
    type: bug
    severity: S3
    title: "Release workflow uses retired actions and removed set-output syntax"
    user_value: null
    evidence:
      - path: .github/workflows/ci.yml
        lines: 10-16
        excerpt: |
          - 
            name: Checkout 
            uses: actions/checkout@v2

          - name: Setup Python 3.8
            uses: actions/setup-python@v3
            with:
              python-version: "3.8"
      - path: .github/workflows/ci.yml
        lines: 27-27
        excerpt: |
          run: echo ::set-output name=tag::$(echo ${GITHUB_REF:10})
    repro: >
      This workflow is the product's only CI and the sole path that builds and
      publishes the package to PyPI. It pins actions to Node16-era majors
      (actions/checkout@v2, actions/setup-python@v3) whose runtime was removed from
      the Actions runner on 2024-11-12 (GitHub changelog: End of life for Actions
      Node16), uses the ::set-output workflow command deprecated since 2022-10-10 and
      superseded by environment files, and builds on Python 3.8, which reached
      upstream end-of-life in October 2024 while the README still declares it the
      supported floor. Any release published from this workflow runs on removed or
      deprecated components; when the runner stops mapping the old actions the
      release path fails with no fallback.
    fix_idea: >
      Bump the pinned actions to current majors, replace the set-output echo with a
      write to the environment-file variable, and move the build to a supported
      Python while keeping packaging metadata consistent.
    blast_radius: >
      The next PyPI release is blocked or silently produces a broken build (e.g. empty
      version tag if the deprecated output mechanism stops being honored); all
      downstream pip installations of the CLI. Works today only while GitHub keeps
      compatibility shims alive.
    regression_test: >
      test_release_workflow_uses_supported_actions: lint the workflow (actionlint or
      equivalent) asserting no set-output commands and only Node-20/current action
      majors; fails today on all three counts, passes after the fix.

  - id: MASH-024
    type: enhancement
    severity: S3
    title: "Add machine-readable JSON output mode"
    user_value: >-
      Scripts and pipelines can consume mash command results as structured JSON
      instead of scraping prose output or reimplementing the API calls themselves.
    evidence:
      - path: src/mash/app.py
        lines: 584-585
        excerpt: |
          if not self.quiet:
            self.print("OK")
    repro: >
      The only output of a successful retrieve is the literal string 'OK' (or nothing
      in quiet/script mode); results are reachable solely through the MPROV_RESULT
      shell variable. mash is explicitly scriptable (stdin file mode, foreach, let
      capture), but nothing it prints is machine-parseable, so callers must capture
      output via the 'let x='retrieve...'' indirection or bypass mash entirely.
    fix_idea: >
      Add a session-level or per-command JSON mode that writes the API response
      (already parsed by response.json()) as JSON on stdout, keeping error text on
      stderr so the stream stays parseable.
    blast_radius: >
      Every automation consumer today must either duplicate control-center API calls or
      parse captured prose; mistakes in that scraping layer silently corrupt
      pipelines. Protective-feature absence: no machine-readable contract on a CLI
      designed to be piped.
    regression_test: >
      test_json_mode_emits_parseable_results: enable JSON mode, run retrieve against a
      stub, and assert stdout parses as JSON equal to the stub body; fails today with
      prose or no output, passes after the fix.

  - id: MASH-025
    type: enhancement
    severity: S3
    title: "Add dry-run mode to destructive verbs"
    user_value: >-
      Operators can preview exactly which control-center records update and delete
      would touch before committing the change.
    evidence:
      - path: src/mash/app.py
        lines: 249-251
        excerpt: |
          def do_delete(self,arg):
            'Issue a delete command to the mPCC. Args delete <model> <model args>'
            self._sendHttpRequest("delete", arg)
    repro: >
      delete and update dispatch straight into _sendHttpRequest with no confirmation,
      no preview, and no dry-run flag. In scripted foreach loops a single wrong
      variable value (e.g. an over-broad retrieve feeding MPROV_RESULT, or the stale
      value from MASH-005) issues immediate destructive calls against the control
      center. The range-expansion in bmc power multiplies the blast: an entire node
      range fires with no review step.
    fix_idea: >
      Add a dry-run flag (session option or verb suffix) that prints the method,
      full URL, and payload the command would send, plus a confirmation prompt or
      require-once flag for interactive delete/update of whole model sets.
    blast_radius: >
      Protective-feature absence on the primary admin tool for a provisioning system:
      a typo reaches production state (or fleet power state via bmc) with no gate;
      recovery means manual control-center cleanup.
    regression_test: >
      test_dry_run_sends_nothing_and_prints_request: enable dry-run, run delete and
      update against a stub, assert the stub received no request and stdout shows the
      would-be method/URL/payload; fails today (requests are sent), passes after the
      fix.

  - id: MASH-026
    type: enhancement
    severity: S3
    title: "Validate config file and warn about unknown keys"
    user_value: >-
      Operators get told immediately when their config file is malformed or contains
      keys mash does not understand, instead of a silent no-connection.
    evidence:
      - path: src/mash/app.py
        lines: 180-188
        excerpt: |
          if not self.load_config():
            self.err("Unable to find working config file.")
            return
          if 'apikey' in self.config_data['global']:
            if self.config_data['global']['apikey'] != "":
              authHeader = f"Api-Key {self.config_data['global']['apikey']}"  
          if 'mprovURL' in self.config_data['global']:
            if self.config_data['global']['mprovURL'] != "":
              self.mprovURL = self.config_data['global']['mprovURL']
    repro: >
      No-argument connect reads only two keys ('apikey', 'mprovURL' under 'global')
      and silently ignores everything else: a config with a typo like 'apiKeys:' or
      'mprovurl:' connects with an empty auth header, and the only symptom is 401s on
      the first verb. There is no validation step at load time, no warning for
      unknown keys, and no schema documented (see MASH-013 for the crash side of the
      same gap).
    fix_idea: >
      Validate the loaded config against the known key set at load_config time,
      emit a warning naming unrecognized keys, and reject connect with a clear error
      when the needed keys are absent or empty.
    blast_radius: >
      Every headless setup (scripts, cron) where the failure mode is silent
      misconfiguration; operators debug the server side instead of their config.
    regression_test: >
      test_config_validation_warns_unknown_keys: load a config containing an
      unrecognized key and assert a warning naming it, and a rejected connect when
      apikey is missing; fails today with silence, passes after the fix.

  - id: MASH-027
    type: enhancement
    severity: S3
    title: "Bound dependency versions in requirements.txt"
    user_value: >-
      Fresh installs of the published package keep working as its dependencies
      release new versions, instead of breaking on whatever PyPI serves that day.
    evidence:
      - path: requirements.txt
        lines: 1-3
        excerpt: |
          pyyaml  # https://pypi.org/project/PyYAML/ - MIT
          jinja2 # https://pypi.org/project/Jinja2/ - 3 Clause BSD
          requests
    repro: >
      All three runtime dependencies are completely unbounded — no minimum, maximum,
      or compatible-release specifier — and setup.py passes these lines straight into
      install_requires while CI publishes the package to PyPI on every release. The
      code depends on nontrivial API contracts (yaml FullLoader semantics, jinja2
      Environment/render, requests Session/HTTPAdapter), so a future major of any of
      the three can break freshly installed clients while previously pinned
      environments keep working.
    fix_idea: >
      Add lower bounds at currently tested versions and considered upper bounds (or
      compatible-release ranges) for the three dependencies, re-verified in the
      release workflow.
    blast_radius: >
      Preventive gap: every future pip install of mprov_mash resolves to untested
      versions; worst case a broad fleet of client installs breaks simultaneously
      when a dependency ships an incompatible major.
    regression_test: >
      test_requirements_are_bounded: assert each requirements.txt entry carries at
      least a lower-bound specifier; fails today with all three unbounded, passes
      after the fix.

  - id: MASH-028
    type: enhancement
    severity: S4
    title: "Add linting to CI"
    user_value: >-
      Style errors and common Python and shell pitfalls are caught before the package
      is published instead of accumulating in a rarely-touched repo.
    evidence:
      - path: .github/workflows/ci.yml
        lines: 18-23
        excerpt: |
          - name: Install Dependancies
            run: |
              sudo apt-get update
              python -m pip install --upgrade pip
              pip install setuptools build
              pip install -r requirements.txt
    repro: >
      The release workflow installs and builds but never lints or checks anything;
      no flake8/ruff config exists in the tree, and the repo has historically had no
      per-commit CI at all (the single workflow only triggers on release). This is
      the one-per-repo lint-enablement item the charter allows; per-line style
      findings are otherwise out of scope.
    fix_idea: >
      Add a lint job (Python linter over src, shellcheck over src/mash/mash and
      gen_changelog.sh) to a push-triggered workflow so regressions surface before
      release.
    blast_radius: >
      Preventive gap only; worst case is reviewer and maintainer friction on future
      contributions to what is currently unlinted code.
    regression_test: >
      test_ci_runs_lint: assert the workflow definition contains a lint step that
      runs a Python linter and shellcheck; fails today (build-only), passes after the
      fix.
