  - id: MASH-008
    type: bug
    severity: S3
    title: "API calls have no timeout and hang the shell indefinitely"
    user_value: null
    evidence:
      - path: src/mash/app.py
        lines: 556-563
        excerpt: |
          if method == "post":
            response = self.session.post(f"{self.mprovURL}{mEndpoint}{idStr}{queryString}", data=json.dumps(requestData), headers={'Connection':'close'}, timeout=None, stream=True)
          elif method == "get":
            response = self.session.get(f"{self.mprovURL}{mEndpoint}{idStr}{queryString}", timeout=None, stream=True) # TODO: Add query string and ID stuff.
          elif method == "patch":
            response = self.session.patch(f"{self.mprovURL}{mEndpoint}{idStr}{queryString}", data=json.dumps(requestData),timeout=None, stream=True) # TODO:
          elif method == "delete":
            response = self.session.delete(f"{self.mprovURL}{mEndpoint}{idStr}{queryString}",timeout=None, stream=True) # TODO
      - path: src/mash/plugins/bmc.py
        lines: 49-49
        excerpt: |
          response = self.mashCmd.session.get(f"{self.mashCmd.mprovURL}power/{action}/?hostname={node}", timeout=None, stream=True)
    repro: >
      Point mash at a control center (or reverse proxy) that accepts the TCP connection
      but never responds, then run any CRUD verb or bmc power command. Every request
      passes timeout=None, so the requests call blocks forever. Verified by execution
      against a mock server that sleeps on /systems: the shell was still alive and
      blocked after the request and neither SIGINT nor SIGTERM ended it (see MASH-009);
      SIGKILL was required.
    fix_idea: >
      Use a finite default timeout (connect plus read) on all session calls, ideally
      set once on the shared Session via a helper, and report a clean network-timeout
      error when it trips.
    blast_radius: >
      A hung proxy, a firewall dropping packets, or a wedged control center freezes
      every mash session touching it; combined with the swallowed signals the only
      escape is kill from another terminal. Automation scripts stall indefinitely
      consuming a worker slot.
    regression_test: >
      test_requests_use_finite_timeout: run retrieve against a stub server that never
      responds and assert mash returns an error within a bounded test timeout; fails
      today by blocking, passes after the fix.

  - id: MASH-009
    type: bug
    severity: S3
    title: "Signal handlers swallow SIGINT and SIGTERM during hung requests"
    user_value: null
    evidence:
      - path: src/mash/main.py
        lines: 8-13
        excerpt: |
          def exitHandler(signum, frame):
            pass

          # setup an exit handler.
          signal.signal(signal.SIGINT, exitHandler)
          signal.signal(signal.SIGTERM, exitHandler)
    repro: >
      Verified by execution: started mash, connected to a mock control center whose
      /systems endpoint hangs, issued retrieve, waited past the request start, then
      sent SIGINT — the process was still alive and still blocked; sent SIGTERM —
      still alive. The handler body is 'pass', which replaces the default disposition
      and discards the interrupt entirely; combined with the no-timeout requests
      (MASH-008) the session can only be ended with SIGKILL.
    fix_idea: >
      Either do not install handlers for these signals (letting KeyboardInterrupt
      terminate cleanly), or make the handler raise SystemExit so interrupted requests
      unwound promptly. If the intent was to clean up background processes, run that
      cleanup and then exit for real.
    blast_radius: >
      Every mash user: Ctrl-C silently does nothing in a hung session or during normal
      use; automation wrappers sending SIGTERM cannot stop a runaway mash process.
      Worst case requires SIGKILL, leaving forked background children orphaned.
    regression_test: >
      test_sigint_terminates_session: start mash blocked on a hanging endpoint, send
      SIGINT, assert the process exits within a few seconds; fails today (verified the
      process survives SIGINT and SIGTERM), passes after the fix.

  - id: MASH-010
    type: bug
    severity: S3
    title: "Error messages are written to stdout, polluting piped script output"
    user_value: null
    evidence:
      - path: src/mash/app.py
        lines: 42-47
        excerpt: |
          def print(self, *args):
            'Use self.print not print() to output so we can catch it internally.'
            print(*args, file=self.stdout)

          def err(self, *args):
            print(*args, file=sys.stderr)
      - path: src/mash/app.py
        lines: 569-571
        excerpt: |
          if response.status_code < 200 or response.status_code > 299 :
            self.print(f"Error: Communications error with mPCC, code: {response.status_code}")
            self.print(f"{response.text}")
      - path: src/mash/app.py
        lines: 579-579
        excerpt: |
          print("Error setting MPROV_RESULT")
      - path: src/mash/plugins/bmc.py
        lines: 38-39
        excerpt: |
          if(self.mashCmd.mprovURL is None) or self.mashCmd.mprovURL == "" :
            print("ERROR: You probably aren't connected.")
    repro: >
      The shell has a proper err() channel to stderr, but most error paths use
      self.print (stdout) or bare print. Verified by execution: piped scripts returned
      'Error: Unknown Model bogusmodel.' and 'Error: Communications error with mPCC,
      code: 500' with the response body mixed into stdout on a zero exit code —
      anything consuming mash stdout (foreach captures, 'let x='retrieve...'' capture
      via execInternal, or a shell pipeline) receives error text as if it were data.
      The bmc plugin additionally uses bare print, bypassing the capturable
      self.stdout entirely.
    fix_idea: >
      Route all error and diagnostic messages through the err() stderr channel and
      reserve stdout for command results, including inside the bmc plugin; audit the
      remaining bare print calls in command paths.
    blast_radius: >
      Scripts driving mash via stdin files or piped shells cannot separate data from
      errors; captured variables can contain error text, and log scrapers see failures
      as normal output. Happens on every API error during scripted use.
    regression_test: >
      test_errors_go_to_stderr_not_stdout: run a piped script whose first command
      errors and assert stdout contains no 'Error:' lines while stderr does; fails
      today with errors on stdout, passes after the fix.

  - id: MASH-011
    type: bug
    severity: S3
    title: "Script mode always exits 0 regardless of command failures"
    user_value: null
    evidence:
      - path: src/mash/app.py
        lines: 625-638
        excerpt: |
          def cmdloop(self, intro=None):
            if self.file != None:
              self.quiet = True
              # we are getting a file piped in.
              # it should be an FD, not a file name.
              for line in self.file:

                line=line.strip()
                # skip comments.
                if len(line) > 0:
                  if line[0] == "#": 
                    continue

