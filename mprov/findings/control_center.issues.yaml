  - id: CC-033
    type: bug
    severity: S3
    title: "Image slug regenerated on every save silently drops renames"
    user_value: null
    evidence:
      - path: systems/models.py
        lines: 470-472
        excerpt: |
            else:
              instance.created_by = request.user
            instance.slug = slugify(instance.name)
      - path: systems/models.py
        lines: 270
        excerpt: |
            slug=models.SlugField(max_length=255, unique=True, editable=False, verbose_name='Image ID', primary_key=True)
    repro: >
      The pre_save hook for images reassigns the slug from the name on every
      save, but the slug is the model's primary key. The update statement then
      matches on the new primary key, which no row has, so renaming an image
      makes the change disappear without an error — or the new slug collides
      with another image and raises an integrity error instead. Any queued
      jobs or jobserver URLs that recorded the previous slug are left
      dangling.
    fix_idea: >
      Set the slug only at creation time when the field is empty, or block
      name changes after creation; if renames must work, migrate the primary
      key explicitly and cascade the update into referencing job parameters
      rather than rewriting it inside a quiet hook.
    blast_radius: >
      Operators renaming images see either a silent no-op or an integrity
      error in the admin, while queued jobs keep firing against the old image
      id. Low-frequency but data-corrupting behavior.
    regression_test: >
      test_image_rename_persists_or_is_refused: create an image, save with a
      new name, re-fetch from the database and assert the new name is present
      with consistent primary-key handling, or that the change was rejected
      with a visible error. Fails today (name reverts silently), passes
      after.
  - id: CC-034
    type: bug
    severity: S3
    title: "Admin mark_rebuild action does not persist version and slug changes"
    user_value: null
    evidence:
      - path: systems/admin.py
        lines: 548-550
        excerpt: |
            # TODO: Increment version number and clear out jobservers field.
            instance.jobservers.clear()
