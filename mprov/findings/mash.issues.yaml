  - id: MASH-012
    type: bug
    severity: S3
    title: "Nonexistent script file argument is silently ignored"
    user_value: null
    evidence:
      - path: src/mash/main.py
        lines: 24-32
        excerpt: |
          if len(sys.argv) >= 2:
            if os.path.exists(sys.argv[1]):
              # we are getting a file passed to us.
              shell.setFile(open(sys.argv[1], 'r'))
              if shell.file == None:
                print(f"Error: Unable to open {sys.argv[1]}")
                sys.exit(1)
          else:
            shell.setFile(None)
    repro: >
      Verified by execution: 'mash /nonexistent/provision.mash' with stdin closed or
      piped produces no output at all and exits 0. os.path.exists fails, no else
      branch exists for that case, and the file stays None, so mash falls through to
      the empty/interactive path. The unreachable 'shell.file is None' error block
      inside the exists branch demonstrates the intent existed but was wired to the
      wrong condition.
    fix_idea: >
      Treat a supplied argv file that does not exist (or cannot be opened) as a hard
      error with a message naming the path and a nonzero exit; also catch open()
      exceptions since a file can exist but be unreadable.
    blast_radius: >
      Operators typo a script path and get silence — with piped stdin an empty
      "successful" run, on a terminal a confusing interactive prompt. Automation
      invoking mash with a wrong path believes the script ran.
    regression_test: >
      test_missing_script_file_errors_out: run mash with a nonexistent script path and
      assert a stderr message and nonzero exit; fails today with exit 0 and no output,
