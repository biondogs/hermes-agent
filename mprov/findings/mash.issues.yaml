            key, value = marg.split("=", 1)
      - path: src/mash/utils.py
        lines: 46-47
        excerpt: |
          start = int(nodeRange[:rangeSpecifier])
          end = int(nodeRange[rangeSpecifier+1:nextRangeEnd]) +1
    repro: >
      Same defect pattern at five command entry points: user input is indexed or
      parsed assuming a shape that is never validated. Verified by execution, each
      killing the whole session with a raw Python traceback: 'connect host apikey'
      (two tokens, args[2] → IndexError), 'let foo' (no '=', ValueError),
      'seq a 1 xx' (int('xx') → ValueError), 'update <model> hostname' or
