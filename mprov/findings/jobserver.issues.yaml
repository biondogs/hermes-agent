  - id: JS-001
    type: bug
    severity: S1
    title: "Remove the committed mPCC API key from stack.env"
    user_value: null
    evidence:
      - path: stack.env
        lines: 1-4
        excerpt: |
          MPROV_URL=http://10.99.137.11
          MPROV_APIKEY=TyvzRDyH.p5lNONyYX6vav3eH5VeAp31OnfPUc4gS
          MPROV_ADDRESS=10.99.137.11
          MPROV_MODS=repo-update image-update image-delete mprov-webserver dnsmasq libgenders
    repro: >
      The file stack.env is tracked in git (added in commit 7479327, most recently
      modified in 7218cdb) and holds a real-looking mPCC API key for the
      10.99.137.11 deployment. dev-docker-compose.yml loads it as env_file for the
      jobserver container. Anyone who clones this general-release repo obtains a
      credential that, with the jobserver apikey auth shown in app.py startSession,
      grants full provisioning API access to that deployment.
    fix_idea: >
      Treat the key as compromised: rotate it at the mPCC, purge the file from
      git history, replace stack.env with a stack.env.example containing an empty
      key, and gitignore the real file. Document env-file provisioning of the key
      as the supported path, as jobserver.yaml.j2 already assumes.
    blast_radius: >
      Loss scenario: any person with read access to the repo (published general
      release) authenticates to the deployment's mPCC as a jobserver, enrolls fake
      jobservers, alters images, distros, or root passwords that image builds bake
      into the fleet. Every deployment that reused this key pattern is exposed.
    regression_test: >
      test_no_secrets_in_tree: scan all tracked files at HEAD for API-key-shaped
      tokens and fail if any file other than an example template contains one.
      Fails today on stack.env, passes after rotation and purge.

  - id: JS-002
    type: bug
    severity: S1
    title: "Stop exposing the distro root password in process argv and daemon logs"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/plugins/image_update.py
        lines: 344-348
        excerpt: |
          # set the root pw to the password in the distro
          if 'rootpw' in imageDetails['osdistro']:
            if imageDetails['osdistro']['rootpw'] is not None and imageDetails['osdistro']['rootpw'] != "" :
              print("Setting root password...")
              os.system(f"echo -e '{imageDetails['osdistro']['rootpw']}\n{imageDetails['osdistro']['rootpw']}' | chroot {imgDir} passwd root")
      - path: src/mprov_jobserver/plugins/image_update.py
        lines: 280-280
        excerpt: |
          print(f"..{imageDetails}")
    repro: >
      Set a rootpw on an OS distro in the mPCC and trigger an image update. At
      image_update.py line 348 the password is interpolated into a shell command
      passed to os.system, so the full string including the plaintext password is
      the argv of the root shell process and is visible to every local user via ps
      during the passwd call. Independently, line 280 prints the whole
      imageDetails dict, which contains the osdistro rootpw, to daemon stdout
      (journald or console per the unit dropin). Additionally, embedding the
      password inside single quotes means a password containing a single quote
      breaks out of the quoting and executes as root shell commands.
    fix_idea: >
      Never place the password on a command line: write it to a root-owned
      mode-600 pipe or temp input and feed passwd via chrooted stdin using an
      argument list with no shell interpolation. Remove the full-dict debug print
      at line 280 or redact secret fields before logging. Validate or single-quote
      escape handling belongs to the no-shell-argument-list approach.
    blast_radius: >
      Loss scenario: a local unprivileged user on any image-build jobserver runs
      ps during a build, captures the fleet root password, and logs in as root on
      every machine provisioned with that distro. Operators reading daemon logs
      see the password with default journal access. Worst case: full fleet root
      compromise from one observation.
    regression_test: >
      test_rootpw_never_in_argv_or_logs: build an image with a sentinel password,
      enumerate all process argv on the host and all daemon log lines during the
      build and assert the sentinel appears in neither. Fails today in both the ps
      snapshot and the log capture, passes after the fix.

  - id: JS-003
    type: bug
    severity: S1
    title: "Stop writing the fleet API key to world-readable files during provisioning"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/plugins/script_runner.py
        lines: 273-277
        excerpt: |
          if entityId == "nads" and sysimage:
            entity['apikey'] = ""
          else:
            # add our apikey to the entity
            entity['apikey'] = self.js.apikey
      - path: src/mprov_jobserver/plugins/script_runner.py
        lines: 284-289
        excerpt: |
          # make sure our local tmp dir exists
          os.makedirs(self.scriptTmpDir, exist_ok=True)

          # output the entity to a json file
          with open(self.scriptTmpDir + "/entity.json", "w") as entFile:
            entFile.write(json.dumps(entity))
      - path: src/mprov_jobserver/plugins/image_update.py
        lines: 319-327
        excerpt: |
          # create a config file to /tmp for our script-runner instance.
          localConfig = [dict()]
          localConfig[0]['global'] = self.js.config_data['global']
          print(localConfig[0]['global']['jobmodules'])
          localConfig[0]['global']['jobmodules'] = ['script-runner']
          localConfig[0]['global']['runonce'] = True
          # print(imgDir + '/tmp/mprov/jobserver.yaml')
          with open(imgDir + '/tmp/mprov/jobserver.yaml',"w") as confFile:
            yaml.dump(localConfig, confFile)
      - path: src/mprov_jobserver/plugins/image_update.py
        lines: 302-304
        excerpt: |
          image_update.join()
          if image_update.threadOk != True:
            return
    repro: >
      The script-runner copies the jobserver's mPCC API key into the entity dict
      (script_runner.py line 277) and dumps it to entity.json under the configured
      tmp dir (script-runner.yaml default is a path under world-readable /tmp)
      created with os.makedirs default perms and open default mode 0644. During
      post-boot runs this happens on every provisioned node. The file is only
      unlinked on the success path at line 304, so any thread crash or mid-run
      failure leaves the key on disk in the clear. Separately, image_update copies
      the whole global config section (which jobserver.yaml defines as containing
      the apikey) into jobserver.yaml inside the image tree at line 327, default
      mode 0644, and only removes it at line 362 after the script run, so the
      early returns at lines 304 and 313 leave the key-bearing config inside the
      image directory on any submodule build failure.
    fix_idea: >
      Create the temp workspace directory with restrictive permissions before
      writing anything containing the key, write key-bearing files with mode 0600,
      use a finally-style cleanup that removes them on all exits, and strip or
      scope the apikey so nodes and image trees never receive the fleet-wide key.
    blast_radius: >
      Loss scenario: any local unprivileged user on a provisioned node or build
      jobserver reads the entity or config file during or after a provisioning
      run and obtains the fleet mPCC API key, giving full control of provisioning.
      Worst case: one crashed post-boot run leaks the key into every node that
      shares the broken script.
    regression_test: >
      test_apikey_file_permissions_and_cleanup: run the script-runner with a
      forced script failure and assert no file under the tmp dir contains the
      sentinel API key afterwards, and assert the key-bearing files are mode 0600
      while present. Fails today on both permissions and cleanup, passes after.

  - id: JS-004
    type: bug
    severity: S1
    title: "Do not execute an unverified binary fetched to world-writable tmp"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/plugins/image_update.py
        lines: 364-366
        excerpt: |
          # grab a copy of busybox to /tmp
          os.system(f"wget -q -O /tmp/busybox https://busybox.net/downloads/binaries/1.35.0-x86_64-linux-musl/busybox")
          os.chmod("/tmp/busybox", 0o755)
      - path: src/mprov_jobserver/plugins/image_update.py
        lines: 379-380
        excerpt: |
          os.system('rm -f ' + imgDir + '/' + imageDetails['slug'] + '.img')
          if os.system('/tmp/busybox tar c -C' + imgDir + ' -f - ./ | gzip -1 -c > /tmp/' + imageDetails['slug'] + '.img'):
    repro: >
      Every image build downloads busybox to the fixed world-writable path
      /tmp/busybox and ignores the wget exit code at line 365. When the download
      fails (network outage, DNS, busybox.net unreachable), the code still chmods
      and executes whatever file is at that path at line 380, as root. A local
      user who pre-creates /tmp/busybox with their own payload gets it executed as
      root on the next build whose download fails. The same lines also write the
      image artifact to the predictable path /tmp/<slug>.img as root, which a
      pre-planted symlink can redirect onto arbitrary files.
    fix_idea: >
      Ship busybox as a packaged dependency or download to a root-only directory
      under the image store with a random name, fail the build when the download
      returns nonzero, and verify the artifact against a pinned checksum before
      executing. Write the image being built inside the image store instead of
      shared /tmp.
    blast_radius: >
      Attack scenario: a local unprivileged user on a build jobserver plants a
      binary at /tmp/busybox and waits for (or induces) a failed download; the
      next image build executes it as root, and every image built afterward by
      that host is attacker-controlled. Worst case: fleet-wide compromise of all
      provisioned machines.
    regression_test: >
      test_busybox_download_failure_aborts_build: simulate an unreachable busybox
      source with a pre-planted decoy file and assert the image build fails without
      executing the decoy. Fails today because the build proceeds to tar, passes
      after the guard.

  - id: JS-005
    type: bug
    severity: S1
    title: "Guard sweep cleanups so a mis-set image or repo directory cannot be wiped"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/plugins/image_sync.py
        lines: 130-140
        excerpt: |
          # Clean up any directories that are not in our imageList.
          print("Scanning for haning images... " + self.imageDir)
          for entry in os.listdir(self.imageDir):
            # print(entry)
            if os.path.isdir(self.imageDir + '/' + entry):
              # see if this entry is in our image list
              if not os.path.basename(entry) in self.imageList:
                # Nope doesn't seem to be there, doesn't need to exist on disk then.
                #print("rm -rf " + self.imageDir + '/' + entry)
                print("Warn: Removed unknown image directory: " + self.imageDir + '/' + entry)
                shutil.rmtree(self.imageDir + '/' + entry)
      - path: src/mprov_jobserver/plugins/repo_sync.py
        lines: 132-143
        excerpt: |
          # Clean up any directories that are not in our repoList.
          print("Scanning for hanging repos... " + self.repoDir)
          # print(self.repoList)
          for entry in os.listdir(self.repoDir):
            # print(entry)
            if os.path.isdir(self.repoDir + '/' + entry):
              # see if this entry is in our repo list
              if not os.path.basename(entry) in self.repoList:
                # Nope doesn't seem to be there, doesn't need to exist on disk then.
                #print("rm -rf " + self.repoDir + '/' + entry)
                print("Warn: Removed unknown repo directory: " + self.repoDir + '/' + entry)
                shutil.rmtree(self.repoDir + '/' + entry)
    repro: >
      Both sync plugins end every pass by recursively deleting every subdirectory
      of the config-supplied imageDir or repoDir that is not in the current sync
      list, with no path validation, ownership marker, staging area, or operator
      confirmation. The lists come from operator config or from the live API. If
      an operator sets imageDir or repoDir to a directory that also holds other
      content (for example the shared /export, which also contains the tftp root
      and the other store per the shipped plugin yamls), the next sync pass
      deletes every subdirectory whose name is not a current image or repo id.
      A transient empty or partial list from the mPCC widens the wipe to nearly
      the whole store.
    fix_idea: >
      Restrict the sweep to a mprov-owned subdirectory, verify the configured path
      is inside a declared mprov data root at config load, only delete directories
      that carry a mprov marker file or whose names match the id format, and skip
      the sweep entirely when the sync list is empty or the API call failed this
      pass.
    blast_radius: >
      Loss scenario: one config typo (or one deployment that points two plugins
      at overlapping paths) silently deletes the image store, the repo mirror, or
      the tftp root on the next 10-second cycle. Recovery requires re-downloading
      or rebuilding the entire store; provisioning fleet-wide stops until then.
    regression_test: >
      test_sweep_never_deletes_unmanaged_dirs: populate a fake imageDir with one
      managed image and several unrelated directories and run one sync pass with a
      healthy and with an empty image list. Assert unrelated directories survive
      both passes. Fails today, passes after guards.

  - id: JS-006
    type: bug
    severity: S2
    title: "Fix status_code 404 comparisons that never match and crash sync loops"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/plugins/image_sync.py
        lines: 56-64
        excerpt: |
          response = self.js.session.get( self.js.mprovURL + 'systemimages/' + image + '/')
          if(response.status_code == "404" ):
            # image not found in the MPCC, must have been removed, delete it locally.
            self.imageList.remove(image)
            print("Error: Image '" + image + "' was not found on the MPCC, removing locally." )
            print("Error: Consider removing it from your config.")
            continue

          mpccVersion = response.json()['version']
      - path: src/mprov_jobserver/plugins/repo_sync.py
        lines: 57-65
        excerpt: |
          response = self.js.session.get( self.js.mprovURL + 'repos/' + str(repo) + '/')
          if(response.status_code == "404" ):
            # repo not found in the MPCC, must have been removed, delete it locally.
            self.repoList.remove(repo)
            print("Error: repo '" + repo + "' was not found on the MPCC, removing locally." )
            print("Error: Consider removing it from your config.")
            continue

          mpccVersion = response.json()['version']
    repro: >
      requests returns status_code as an int, so the comparison against the string
      404 is always false and the deleted-upstream branch is dead code. Remove an
      image (or repo) from the mPCC that a jobserver still has configured or
      remembered: the 404 handler never runs, control falls to response.json()
      which is the error body, and the subscript for version raises KeyError,
      killing the plugin thread inside the daemon. The sync loop then aborts
      before the remaining images in the list sync and before the version file is
      updated, on every heartbeat pass, and the intended local cleanup message is
      never printed.
    fix_idea: >
      Compare the integer status code to the integer 404 in both files, and wrap
      the version lookup so any unexpected response body is reported and the loop
      continues with the next entry instead of crashing the whole pass.
    blast_radius: >
      Any image or repo removed upstream breaks image-sync and repo-sync entirely
      on every jobserver that references it: no other image or repo syncs on that
      host until an operator edits config, and stale local copies accumulate with
      a confusing trace in the journal rather than the intended cleanup message.
    regression_test: >
      test_deleted_upstream_404_is_handled: point the sync plugin at a mock server
      where one listed image returns 404 and another returns a newer version.
      Assert the first is cleanly skipped with a message and the second still
      syncs. Fails today with a KeyError crash and no second sync, passes after.

  - id: JS-007
    type: bug
    severity: S2
    title: "Fix malformed job query that claims every pending job in the queue"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/plugins/image_update.py
        lines: 241-244
        excerpt: |
          # json to pass to the job search.
          paramstr="{\"imageId\":\"" + image + "\"}"
          if self.js.update_job_status(self.jobModule, 2, jobquery=paramstr):
            updateFound=True
      - path: src/mprov_jobserver/app.py
        lines: 221-225
        excerpt: |
          if jobid is not None:
            # get the specific job status
            queryURL = self.mprovURL + 'jobs/' + str(jobid) + '/'
          elif jobquery != "":
            queryURL = self.mprovURL + 'jobs/?' + jobquery
      - path: src/mprov_jobserver/app.py
        lines: 256-259
        excerpt: |
          data['id'] = job['id']
          data['jobserver'] = self.id
          # print(data)
          response = self.session.patch(self.mprovURL + 'jobs/' + str(data['id']) + '/', data=json.dumps(data))
    repro: >
      When imageList is configured, image_update builds the raw query string of a
      JSON object and passes it as jobquery, intending to filter jobs by params.
      update_job_status appends it directly after the query mark, producing jobs
      followed by the bare JSON blob. The mPCC jobs view (verified in
      control_center jobqueue views, which only reads the params, module,
      jobserver, and status query keys) ignores the unrecognized key pair, so the
      GET returns every job with no status filter. The patch loop in
      update_job_status then marks every non-terminal job in the entire queue as
      RUNNING and reassigns its jobserver field to this host, stealthing jobs that
      belong to other jobservers and modules. Their owning plugins never pick
      them up again because they only query status 1 or their own running set.
    fix_idea: >
      Encode the intended filter properly as a params query key with URL-encoding
      applied, or filter the returned job list client-side by comparing parsed
      params before patching. Additionally, have update_job_status refuse to patch
      jobs whose module does not match the calling plugin as a backstop.
    blast_radius: >
      Any deployment that sets imageList on an image-update jobserver corrupts the
      whole pending queue on the first check: every queued job across all modules
      flips to RUNNING on a host that cannot execute most of them, and operators
      must clear stuck jobs manually. Multi-jobserver sites lose queued work to
      silent theft.
    regression_test: >
      test_configured_imagelist_query_is_scoped: with a mock mPCC queue holding
      pending jobs for several modules, run the image_update check with a
      configured imageList and assert only matching image-update jobs are patched
      and only that module's statuses change. Fails today with unrelated jobs
      patched, passes after.

  - id: JS-008
    type: bug
    severity: S2
    title: "Fix group script dependency handling that crashes the resolver"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/plugins/script_runner.py
        lines: 195-199
        excerpt: |
          if len(script['dependsOn']) > 0:
            # we have deps.
            for dep in script['dependsOn']:
              print(dep)
              deps.append(dep)
      - path: src/mprov_jobserver/plugins/script_runner.py
        lines: 181-185
        excerpt: |
          if len(script['dependsOn']) > 0:
            # we have deps.
            for dep in script['dependsOn']:
              deps.append(dep['slug'])
    repro: >
      For scripts from system groups the dependency loop appends the raw
      dependsOn entry object instead of its slug field, unlike the identical loops
      for distro and entity scripts. The serialized dependsOn entries are dicts.
      depResolve then converts each value list to a set, and a set containing a
      dict raises TypeError for unhashable type. Any group-assigned script that
      declares even one dependency therefore crashes the resolver with an
      exception inside the plugin thread before any script runs, leaving the
      already-created nologin file and the entity file with its apikey behind
      on the node, and the failed run still exits via the swallowed thread death
      path.
    fix_idea: >
      Extract the slug field from each dependsOn entry in the group loop exactly
      as the distro and entity loops do, and make depResolve fail with a clear
      printed error instead of an unhashable-type crash if a non-string ever
      reaches it.
    blast_radius: >
      Every system using group-level scripts with dependencies (a primary
      mprov feature) gets no scripts executed at all during provisioning, with
      only a thread traceback in the journal to explain it. Freshly provisioned
      nodes skip all group post-boot setup until the bug is fixed.
    regression_test: >
      test_group_script_with_dependency_resolves: feed the script-runner a mock
      entity whose group carries one script with one dependsOn entry and assert
      the resolver returns ordered steps and the script runs. Fails today with
      TypeError, passes after.

  - id: JS-009
    type: bug
    severity: S2
    title: "Stop creating /etc/nologin before validation and leaking it on error paths"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/plugins/script_runner.py
        lines: 87-91
        excerpt: |
          file_path = Path("/etc/nologin")
          try:
            file_path.touch()
          except:
            pass
      - path: src/mprov_jobserver/plugins/script_runner.py
        lines: 99-102
        excerpt: |
          if '-h' in sys.argv:
            # someone passed the -h flag, print the help.
            self.printHelp()
            return False
      - path: src/mprov_jobserver/plugins/script_runner.py
        lines: 303-308
        excerpt: |
          # remove the entity file.
          os.unlink(self.scriptTmpDir + "/entity.json")
          try:
            os.unlink("/etc/nologin")
          except:
            pass
    repro: >
      handle_jobs touches /etc/nologin first, before any argument validation.
      The removal happens only at the end of the success path at line 306. Every
      early return and every bare exit call before that point (the help flag at
      line 101, the mutually-exclusive-options error at line 108, the
      missing-option error at line 123, the entity-fetch failures at lines 152,
      156, and 168) leaves /etc/nologin in place on the machine. Simply running
      the post-boot unit with dash h to view help blocks all non-root interactive
      logins on that node until someone removes the file by hand.
    fix_idea: >
      Move the nologin creation after all argument and entity validation, and
      register a cleanup that always removes nologin when handle_jobs exits by
      any path, including exceptions raised inside the script threads. Audit the
      early paths to replace bare exit calls with a normal return after cleanup.
    blast_radius: >
      Any failed or aborted provisioning or post-boot run locks out every
      non-root login on the affected node, including emergency interactive access
      during exactly the incidents the operator is likely to be debugging. Persists
      across reboots since nothing else removes the file.
    regression_test: >
      test_nologin_removed_on_all_exits: invoke the script-runner help path and a
      forced entity-fetch failure and assert /etc/nologin does not exist after
      each. Fails today on both, passes after.

  - id: JS-010
    type: bug
    severity: S2
    title: "Propagate post-boot and image script failures instead of reporting success"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/plugins/script_runner.py
        lines: 311-317
        excerpt: |
          def runScript(self, filename):
            # grab the file
            local_file = self.download_file(filename)

            # run the file
            subprocess.run(local_file, shell=True)
      - path: src/mprov_jobserver/plugins/script_runner.py
        lines: 291-304
        excerpt: |
          for step in scriptDeps:
            threads = []
            for script in step:
              # download the script and thread it out within this step.
              print(f"Running {scripts[script]['filename']}")
              t = Thread(target=self.runScript, args=(scripts[script]['filename'], ))
              t.start()
              threads.append(t)
    repro: >
      runScript ignores the subprocess return code completely, and each script is
      run in a bare Thread whose exception, if raised before the subprocess even
      starts (for example a download failure in download_file), is swallowed by
      the default thread excepthook. handle_jobs joins the threads, prints
      complete, unlinks nologin, and returns; the oneshot unit then exits zero.
      A post-boot script that fails on every node therefore reports success to
      systemd and to the operator, and provisioning continues on broken systems
      with no failure signal anywhere except a traceback in the journal.
    fix_idea: >
      Capture the subprocess return code per script, record per-thread success in
      a shared structure the threads set, and after joining assert that every
      script in every step returned zero before declaring completion. On any
      failure, print which script failed with its exit code, skip the remaining
      steps, and exit nonzero so the oneshot unit and any calling pipeline see
      the failure.
    blast_radius: >
      Silent partial provisioning fleet-wide: any failed setup script (disk
      layout, mounts, networking) is invisible because exit codes lie. Operators
      discover the breakage much later as inexplicable node behavior, and remediation
      requires no signal to trigger it. This is the highest-cost class of
      provisioning bug: plausible-looking success over broken machines.
    regression_test: >
      test_failing_script_fails_the_run: stage one script that exits nonzero in a
      mock script set and run the script-runner. Assert the process exits nonzero
      and prints the failing script name. Fails today with exit zero, passes after.

  - id: JS-011
    type: bug
    severity: S2
    title: "Fix inverted switch merge so switches get DHCP entries"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/plugins/dnsmasq_mod/dhcp.py
        lines: 52-54
        excerpt: |
          response = self.js.session.get( self.js.mprovURL + 'switches/?network=' + network['slug'])
          if not self.checkHTTPStatus(response.status_code):
              data_hosts['hosts'] = data_hosts['hosts'] + (response.json()[0])
    repro: >
      The merge of switch management interfaces into the DHCP host list is gated
      on the request having FAILED (the condition is negated). When the switches
      endpoint returns a healthy 2xx response the merge is skipped, so switch
      management MAC and IP data never reaches the generated dhcp host config and
      switches receive neither reservations nor PXE boot entries. When the request
      fails, the code instead tries to parse an error body and take its first
      element, raising inside the thread. The parallel dns module merges switches
      unconditionally on success, confirming the intended direction.
