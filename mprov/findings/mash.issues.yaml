    repro: >
      Verified by execution: a piped script containing only failing commands (unknown
      model, HTTP 500 delete) completes and the process exits 0. File mode ignores the
      return value of every onecmd, tracks no failure state, and main() never sets an
      exit code. Any wrapper (cron, CI, provisioning pipeline) cannot detect that the
      mash script did nothing it was asked to do.
    fix_idea: >
      Track a session-level failure flag set by error paths in the request dispatcher
      and commands, and have main exit nonzero after file-mode processing if any
      command failed (or if the script aborted early).
