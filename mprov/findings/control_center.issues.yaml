  - id: CC-031
    type: bug
    severity: S3
    title: "Model signals recover the request via stack-frame inspection"
    user_value: null
    evidence:
      - path: systems/models.py
        lines: 393-400
        excerpt: |
            if sender == SystemImage or sender == System:
              import inspect
              for frame_record in inspect.stack():
                  if frame_record[3]=='get_response':
                      request = frame_record[0].f_locals['request']
                      break
              else:
                  request = None
      - path: networks/models.py
        lines: 107-113
        excerpt: |
            import inspect
            for frame_record in inspect.stack():
                if frame_record[3]=='get_response':
                    request = frame_record[0].f_locals['request']
                    break
            else:
                request = None
    repro: >
      pre_save signal handlers walk the entire Python stack looking for the
      framework's response frame to grab the current request, on every save
      of the affected models. The technique breaks under any runner that saves
      outside a request cycle (management commands, shell, tests, async
      dispatch), silently falling back to no request — leaving audit fields
      unset or defaulted to a hard-coded user — and the cost of a full stack
      walk is paid on every write.
    fix_idea: >
      Use a thread-local request middleware or an explicit actor parameter
      passed down from the service layer, giving every save path a defined
      actor instead of reverse-engineering it from frame objects.
    blast_radius: >
      Audit fields silently stay unset or fall back to user one under
      non-request save paths in all deployments; subtle wrong data that is
      hard to trace, plus per-save overhead.
    regression_test: >
      test_created_by_set_from_management_command: save a model inside a
      management command with an explicit actor parameter and assert the
      audit field is recorded (or that the fallback is explicit and
      documented). Fails today on the no-request path, passes after explicit
      actor plumbing.
