      - path: osmanagement/models.py
        lines: 70
        excerpt: |
            rootpw = models.CharField(default="changeme", help_text="Root Password for the image", max_length=255, verbose_name="Root Password", blank=True)
    repro: >
      BMC credentials are stored as plain CharFields and the ModelSerializers
      for SystemBMC and OSDistro serialize all model fields, so any GET of the
      systembmcs, systems detail, or osdistros endpoints returns the BMC
      password and the image root password in the JSON body, in cleartext.
    fix_idea: >
      Exclude secret fields from list and detail serializers (explicit field
      lists or a write-only declaration on password fields), store BMC
      credentials encrypted at rest using a vetted encryption field, and
      provide a separate audited rotation flow instead of returning secrets on
      every read.
    blast_radius: >
      Scenario: a read-only compromise of one jobserver key or one low-privilege
      authenticated session dumps the BMC passwords of every managed server and
      the root password baked into every OS image in one paginated GET; those
      credentials then reach every baseboard management controller in the
      fleet. Affects every deployment on every API read.
    regression_test: >
      test_bmc_serializer_hides_password: serialize a SystemBMC and an OSDistro
      with populated secrets and assert the password keys are absent from the
      output dict. Fails today (keys present), passes after exclusion.
