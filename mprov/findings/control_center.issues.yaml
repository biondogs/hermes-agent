  - id: CC-038
    type: bug
    severity: S2
    title: "PATCH handler silently substitutes admin user for anonymous requests"
    user_value: null
    evidence:
      - path: common/views.py
        lines: 170-173
        excerpt: |
            def patch(self, request, *args, **kwargs):
                if(type(request.user) == AnonymousUser ):
                    request.user = User.objects.get(username='admin')
                return self.partial_update(request, args, kwargs)
    repro: >
      The shared PATCH implementation replaces an anonymous request user with
      a hard-coded admin superuser before performing the update. Because the
      class's permission gate accepts an API key without authentication
      (CC-001), any key-holding caller executes writes as the superuser:
      audit fields record admin, and no per-user write checks can ever be
      enforced on PATCH paths built on this base class. If the admin account
      was renamed or removed, every PATCH crashes with a 500.
    fix_idea: >
      Reject anonymous mutations instead of impersonating a superuser; require
      an authenticated session for PATCH, and derive any system-account
      behavior from an explicitly named, limited service account rather than
      a hard-coded admin username.
    blast_radius: >
      Every PATCH on every model endpoint executes with superuser identity
      for key-bearing callers, forging the audit trail and foreclosing future
      permission tightening; combined with a leaked key the write path is
      indistinguishable from the real administrator.
    regression_test: >
      test_patch_with_api_key_is_not_admin_impersonated: PATCH an object with
      a valid API key and no user credentials; assert the request is rejected
      with 401 or 403 and no audit field records admin. Fails today (the
      update succeeds as admin), passes after anonymous mutations are refused.
  - id: CC-039
    type: bug
    severity: S3
    title: "Config comment filter removes list items while iterating them"
    user_value: null
    evidence:
      - path: systems/models.py
        lines: 151-154
        excerpt: |
            lines = sysgrpfield.split("\n")
            for line in lines:
              if line.startswith("#"):
                lines.remove(line)
    repro: >
      The system-group config inheritance strips commented lines by calling
      remove on the list being iterated. After a removal the iterator steps
      past the next element, so two or more consecutive comment lines leave
      the second one in the merged config; the surviving comment text is then
      appended into inherited kernel cmdline or module fields that get baked
      into boot configuration.
    fix_idea: >
      Filter into a new list — keeping lines that do not start with the
      comment marker — instead of mutating the list during iteration.
    blast_radius: >
      Any system group whose multi-line config contains adjacent comment
      lines produces inherited config with stray comment fragments flowing
      into kernel command lines; silent bad configuration on affected
      machines.
    regression_test: >
      test_consecutive_comments_all_stripped: call the inheritance logic on a
      field with three consecutive comment lines followed by a value and
      assert no comment text remains. Fails today (a middle line survives),
      passes after rebuilding the list.
  # Adjudication entry 2026-10-15 (sw-architect): re-applied here per charter
  # section 5 (file against the repo owning the primary evidence) and R14,
  # from the cross-repo routing note in findings/mash/REVIEW-NOTES.md, where
  # the mash reviewer scoped and execution-verified the mash side. Independent
  # source verification of systems/views.py:816-822 was done by the adjudicator
  # at commit 98d4579. Not a duplicate of CC-035 (same view, different defect:
  # CC-035 covers 500s on missing params, this covers wrong-target matching).
  # IDs are never reused.
  - id: CC-040
    type: bug
    severity: S1
    title: "Power endpoint hostname parameter is a substring match hitting wrong nodes"
    user_value: null
    evidence:
      - path: systems/views.py
        lines: 816-822
        excerpt: |
            if 'hostname' in request.query_params:
              # someone is searching by hostname
              system_results= System.objects.filter(hostname__contains=request.query_params['hostname'])
              if system_results.count() > 0:
                if system_results.count() > 10:
                  print("WARN: Large node set returned, truncating.")
                  system_results = system_results[:10]
    repro: >
      The power API view filters systems with a hostname-contains query on the
      raw query parameter, so a value an operator believes to be an exact
      hostname matches every system whose hostname merely contains the string.
      Callers that pass hostnames straight through, such as the mash shell's
      bmc power command, send exactly this belief. When more than ten systems
      match, the queryset is silently truncated to the first ten and the power
      action is executed against each of their BMCs, with the truncation
      noted only on server stdout. A targeted power-off of compute001 can
      therefore power off compute001 plus sibling-named systems such as
      compute0010 through compute0019, capped at ten machines per call.
    fix_idea: >
      Change the hostname branch to an exact-match lookup on the hostname
      field. If partial matching is an intended feature, move it to an
      explicitly named parameter with documented semantics and a confirmation
      step for multi-system result sets, and never silently truncate a
      destructive multi-target action.
    blast_radius: >
      Any power action issued against a node whose hostname is a substring of
      other hostnames force-powers-off up to ten wrong nodes, each potentially
      carrying unsaved work, while the mash CLI displays no per-node results
      at all. The operator discovers the collateral damage only when the
      machines go down.
    regression_test: >
      test_power_hostname_exact_match: seed systems named compute001 and
      compute0010 each with a BMC, issue a power request carrying the compute001
      hostname parameter, and assert only compute001's BMC received the action.
      Fails today with both systems targeted, passes after the lookup is made
      exact or confirmation-gated.
