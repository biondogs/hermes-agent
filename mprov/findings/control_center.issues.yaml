findings:
  - id: CC-001
    type: bug
    severity: S1
    title: "Any API key grants unrestricted read-write access to every model endpoint"
    user_value: null
    evidence:
      - path: common/views.py
        lines: 38-40
        excerpt: |
            filter_backends = [filters.SearchFilter]
            search_fields = ['name']
            permission_classes = [HasAPIKey|IsAuthenticated]
      - path: scripts/scripts_urls.py
        lines: 4-7
        excerpt: |
            urlpatterns = [
                path('<int:pk>/', ScriptAPIView.as_view()),
                path('', ScriptAPIView.as_view()),
            ]
      - path: install_scripts/install_initial_jobserver.sh
        lines: 6-12
        excerpt: |
            cat << EOF > /tmp/genAPIKey.py
            import rest_framework_api_key
            apikey = rest_framework_api_key.models.APIKey()
            key = rest_framework_api_key.models.APIKey.objects.assign_key(apikey)
            apikey.name="mProv Jobserver Key"
            apikey.save()
            print(key)
    repro: >
      Every model view inherits the shared base class whose permission_classes
      uses the bitwise OR of HasAPIKey and IsAuthenticated, so satisfying either
      one alone is enough. The one generated key ("mProv Jobserver Key") is
      therefore equivalent to a full admin credential for the REST API: a holder
      can GET every list, PATCH, POST and DELETE every model (systems, networks,
      scripts, disk layouts, OS distros, job modules) with no scope, no
      per-object checks and no revocation path other than deleting the single key.
    fix_idea: >
      Treat API keys as scoped agent credentials: define per-object permission
      classes that restrict key-authenticated requests to the specific models a
      jobserver agent needs, require an authenticated staff session for any
      human-facing mutation, and replace the bitwise OR with a policy object
      that grants access only for the intended combination. Generate a distinct
      key per registered jobserver so a leak can be revoked without
      re-provisioning the fleet.
    blast_radius: >
      Scenario: any single jobserver host or backup that leaks the shared key
      hands an attacker full read-write control of the provisioning control
      plane, including reading BMC passwords and rewriting the images that get
      installed on every managed machine. All endpoints, every deployment,
      worst case is fleet-wide compromise via one filesystem read.
    regression_test: >
      test_api_key_readonly_scope: create an API key, GET a model list (expect
      403 unless the model is agent-required), and DELETE an object with only
      the key (expect 403). Fails today with 200, passes once keys are scoped.
