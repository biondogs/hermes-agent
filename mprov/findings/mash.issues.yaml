findings:
  - id: MASH-001
    type: bug
    severity: S2
    title: "Connect with user and password never authenticates"
    user_value: null
    evidence:
      - path: src/mash/app.py
        lines: 199-203
        excerpt: |
          if 'user' == args[2]:
            # We are using plain text auth
            rawAuthStr=f"{args[2]}:{args[4]}"
            encAuthStr=base64.b64encode(rawAuthStr)
            authHeader = f"Basic {encAuthStr}"
    repro: >
      Type 'connect http://host user alice password secret' exactly as documented by
      'help connect'. args is the space-split list [url, user, alice, password, secret],
      so the branch condition compares 'user' to args[2] which holds the username
      'alice' — the branch never matches and authHeader stays empty, so mash connects
      unauthenticated and every subsequent verb fails with Unknown Model / 401 errors.
      Even in the accidental case where the username is literally the string 'user',
      base64.b64encode is called on a str instead of bytes and raises TypeError
      (verified: 'TypeError: a bytes-like object is required, not str').
    fix_idea: >
      Test the auth-mode token at args[1] instead of args[2], validate argument count
      before indexing, and encode the credentials string as UTF-8 bytes before base64
      encoding. Consider reading the password via getpass-style prompt or config file
      rather than the command line.
    blast_radius: >
      Every operator who follows the documented user/password connection syntax gets an
      unauthenticated session with confusing downstream errors instead of a working
      connection; the feature has likely never worked as shipped.
    regression_test: >
      test_connect_user_password_builds_basic_auth: invoke do_connect with 'url user
      alice password secret' against a stub session and assert the Authorization header
      is Basic with the base64 of alice:secret; fails today with an empty header,
      passes after the fix.

  - id: MASH-002
    type: bug
    severity: S2
    title: "Plugin dispatch mangles arguments containing the plugin name"
    user_value: null
    evidence:
      - path: src/mash/app.py
        lines: 91-92
        excerpt: |
          pluginName, args = args.split(" ", 1)
          args = args.replace(pluginName, "")
    repro: >
      Run 'bmc power on bmc001'. default() splits off the plugin name 'bmc' and then
      does a global substring replace of 'bmc' in the remaining argument string, so
      'power on bmc001' becomes 'power on 001' — the node name is corrupted before the
      plugin receives it. Verified by execution: the passed string is literally
      'power on 001' and the request targets hostname=001 instead of bmc001.
    fix_idea: >
      Remove the substring replace; the split on the first space already removed the
      plugin token. If leading-space normalization is needed, strip only whitespace.
    blast_radius: >
      Any plugin argument containing the plugin name as a substring — node names like
      bmc001, paths, or free text — is silently corrupted; BMC power operations are sent
      for the wrong hostnames with no warning.
    regression_test: >
      test_plugin_args_not_mangled_by_plugin_name: dispatch 'bmc power on bmc001'
      through default() with a stub plugin and assert the plugin receives 'power on
      bmc001'; fails today with 'power on 001', passes after the fix.

  - id: MASH-003
    type: bug
    severity: S2
    title: "BMC power commands fail unless mprovURL ends with a slash"
    user_value: null
    evidence:
      - path: src/mash/plugins/bmc.py
        lines: 47-49
        excerpt: |
          for node in nodelist:
            # print(f"'{self.mashCmd.mprovURL}'")
            response = self.mashCmd.session.get(f"{self.mashCmd.mprovURL}power/{action}/?hostname={node}", timeout=None, stream=True)
    repro: >
      Connect with the natural form 'connect http://127.0.0.1:8080 apikey KEY' (no
      trailing slash) and run 'bmc power on node01'. The URL is composed as
      mprovURL + 'power/on/' which yields http://127.0.0.1:8080power/on/ — the host
      becomes '127.0.0.1:8080power'. Verified by execution against a local mock: the
      command fails with 'Failed to parse: 127.0.0.1:44143power is not a valid host or
      port', while the identical command with a trailing-slash connect URL succeeds.
      The CRUD verbs are unaffected because datamodel endpoints (e.g. /systems/) carry
      their own leading slash, so users have no signal they must add one.
    fix_idea: >
      Normalize mprovURL once at connect time to exactly one trailing slash, or join
      the power path with a leading slash in the plugin; make both code paths share a
      single URL-join helper.
    blast_radius: >
      BMC power operations fail with an opaque URL-parse error for every operator who
      connects without a trailing slash — the form that works for all other verbs.
    regression_test: >
      test_bmc_power_url_without_trailing_slash: connect to a stub server URL without
      trailing slash, run bmc power on, and assert the request hit /power/on/ on the
      stub; fails today with an invalid-host error, passes after the fix.

  - id: MASH-004
    type: bug
    severity: S2
    title: "BMC power commands give no success or failure feedback"
    user_value: null
    evidence:
      - path: src/mash/plugins/bmc.py
        lines: 47-49
        excerpt: |
          for node in nodelist:
            # print(f"'{self.mashCmd.mprovURL}'")
            response = self.mashCmd.session.get(f"{self.mashCmd.mprovURL}power/{action}/?hostname={node}", timeout=None, stream=True)
    repro: >
      Run 'bmc power cycle compute001' against a control center. The response object is
      assigned and never inspected: status code and body are discarded, nothing is
      printed on success or on failure. Verified by execution against a mock returning
      200 with a result body: zero bytes of output; a 500 response also produces zero
      output. The operator cannot distinguish a successful fleet power operation from a
      failed or no-op one.
    fix_idea: >
      Check the response status and print a per-node result line (hostname plus server
      result or error) to stdout, and surface command-level failure so scripts can
      detect it.
    blast_radius: >
      Operators run power on/power off/cycle blind during maintenance; a failed or
      404-inducing power command looks identical to a successful one, risking
      maintenance actions on nodes that never rebooted or were never powered off.
    regression_test: >
      test_bmc_power_prints_result_and_errors: run bmc power on against a stub
      returning 200 then a stub returning 500 and assert success and failure output
      differ; fails today with no output in both cases, passes after the fix.

  - id: MASH-005
    type: bug
    severity: S2
    title: "Failed API calls leave stale MPROV_RESULT from the previous command"
    user_value: null
    evidence:
      - path: src/mash/app.py
        lines: 569-572
        excerpt: |
          if response.status_code < 200 or response.status_code > 299 :
            self.print(f"Error: Communications error with mPCC, code: {response.status_code}")
            self.print(f"{response.text}")
            return
      - path: src/mash/app.py
        lines: 502-504
        excerpt: |
          if model not in self.models:
            self.print(f"Error: Unknown Model {model}.")
            return
    repro: >
      In a piped script: 'retrieve systems.models.System' succeeds and MPROV_RESULT is
      set to the result list; then 'delete systems.models.System id=1' returns HTTP 500
      and returns early at the communications-error branch without clearing
      MPROV_RESULT. Verified by execution: 'pvar MPROV_RESULT' afterwards still shows
      the previous retrieve's data. Contrast the field-validation paths at lines
      527-529 and 535-537, which do set MPROV_RESULT to None — the error contract is
      inconsistent. The do_retrieve docstring promises MPROV_RESULT is None on error.
    fix_idea: >
      Set the MPROV_RESULT variable to None on every early-return error path in the
      request dispatcher, ideally via a single exit helper so new error branches cannot
      forget it.
    blast_radius: >
      Scripts that branch on MPROV_RESULT after a failed command silently consume the
      previous command's data — e.g. a foreach over MPROV_RESULT repeats operations on
      the wrong (stale) objects. Worst case: destructive follow-up verbs driven by
      stale results.
    regression_test: >
      test_mprov_result_cleared_on_http_error: succeed a retrieve, then issue a
      delete against an endpoint returning 500, assert MPROV_RESULT is None; fails
      today retaining the old value, passes after the fix.

  - id: MASH-006
    type: bug
    severity: S2
    title: "Pvar cannot print comma-separated variables with multi-character names"
    user_value: null
    evidence:
      - path: src/mash/app.py
        lines: 341-345
        excerpt: |
          csvparser = csv.reader(arg)
          for vars in csvparser:
            for varName in vars:
              if varName in self.variables:
                self.print(f"{varName}={self.variables[varName]}")
    repro: >
      'let foo=1', 'let bar=2', then 'pvar foo,bar' as documented by the command's
      help text ("a comma separated list of variables"). csv.reader is given the bare
      string, which it treats as an iterable of single characters: the parsed rows are
      single characters like 'f', 'o', 'o', so no defined multi-character variable ever
      matches. Verified by execution: 'pvar foo,bar' prints nothing, while 'pvar foo'
      prints 'foo=1'.
    fix_idea: >
      Wrap the argument in a one-element list before parsing, or split on commas
      directly and strip whitespace from each name.
    blast_radius: >
      The documented comma-list display feature silently prints nothing for any
      real-world variable name; scripts and operators get no output and no error.
    regression_test: >
      test_pvar_comma_list_multi_char_names: define foo and bar, run pvar foo,bar,
      assert both 'foo=1' and 'bar=2' are printed; fails today with no output, passes
      after the fix.

