  - id: JS-015
    type: bug
    severity: S2
    title: "Fix repack_image so it does not destroy the image it repacks"
    user_value: null
    evidence:
      - path: repack_image
        lines: 1-7
        excerpt: |
          #!/bin/bash
          # example repack script, may need tweaking.
          # pass the path to the image directory

          rm $1/`basename $1`.img -f
          busybox tar c -C $1-f - ./ | gzip -1 -c > /tmp/`basename $1`.img
          mv /tmp/`basename $1`.img $1/`basename $1`.img
    repro: >
      The script deletes the existing image first, then tars the directory. The
      tar arguments are malformed: -C is given the single glued token made of the
      path and a stray dash-f, so tar fails to change into the image directory
      (and the unquoted path argument breaks entirely on paths containing spaces).
      The pipeline exit code is that of gzip, which happily compresses the empty
      stdin tar produces, so the failure is not detected. The result is a tiny
      valid-looking gzip file that is moved over the freshly deleted image path,
      replacing a real image with an empty artifact that still looks plausible by
      name.
    fix_idea: >
      Quote every path argument, put a space between the chdir option and its
      value and correct the dash-f placement, enable shell error and pipefail
      strictness, build the new image beside the old one, and only replace the
      original after verifying the new artifact is non-empty and tar succeeded.
    blast_radius: >
      An operator who runs the shipped script per its own comment loses the image
      file unrecoverably (the directory contents remain, but the distributable
      artifact is gone) and receives an empty replacement that naming suggests is
      valid. If synced or served, machines boot a zero-content image. Added
      upstream 2026-07 and shipping in the general release as-is.
    regression_test: >
      test_repack_produces_valid_image: run the script on a prepared image
      directory containing fixtures and assert the produced image file is
      non-empty, gunzips, and contains the fixture files. Fails today with an
      empty artifact, passes after.

  - id: JS-016
    type: bug
    severity: S3
    title: "Tolerate unset optional network fields in DHCP config generation"
    user_value: null
    evidence:
      - path: src/mprov_jobserver/templates/dnsmasq/dhcp.conf.j2
        lines: 7-8
        excerpt: |
          {% if ":" in network.dhcpstart %}
          dhcp-range=set:{{network.slug}},{{network.dhcpstart}},{{network.dhcpend}},slaac
      - path: src/mprov_jobserver/templates/dnsmasq/dhcp.conf.j2
        lines: 13-15
        excerpt: |
          {% if ":" in network.gateway %}
          {% else %}
          dhcp-option=tag:{{network.slug}},option:router,{{network.gateway}}
    repro: >
      The template tests membership of a colon in each optional network field
      before rendering options. The mPCC Network model defines dhcpstart,
      dhcpend, gateway, and nameserver1 all as nullable and blank-allowed
      (verified in control_center networks models), and the mPCC API docs mark
      gateway and nameserver1 as optional. When any network in the isdhcp set has
      one of these fields null, the membership test against None raises TypeError
      during render (verified with the same jinja2 construct), the DHCP regen
      thread dies, dnsmasq keeps its previous configuration, and the jobs that
      triggered the regen remain stuck in RUNNING. The upstream project has
      already fixed this class once for empty IPs on systems, so null optional
      fields are a live data shape.
    fix_idea: >
      Guard each optional field against being undefined or empty before the
      address family test, skipping the corresponding option for that network,
      and render a commented placeholder line so operators can see which networks
      lack which options.
    blast_radius: >
      A single network record with a legitimately unset gateway or nameserver
      stops all DHCP and DNS config regeneration for the whole jobserver, freezing
      the running dnsmasq config and stranding the triggering jobs until the
      operator finds the traceback in the journal.
    regression_test: >
      test_null_gateway_renders_cleanly: render the dhcp template with a network
      fixture carrying null gateway and nameserver1 and assert the output contains
      no options for those fields and no exception. Fails today with TypeError,
      passes after.

