  - id: MASH-013
    type: bug
    severity: S3
    title: "Common config file shapes crash connect with raw tracebacks"
    user_value: null
    evidence:
      - path: src/mash/app.py
        lines: 75-77
        excerpt: |
          result = {}
          for entry in self.config_data:
            result.update(entry)
      - path: src/mash/app.py
        lines: 183-183
        excerpt: |
          if 'apikey' in self.config_data['global']:
    repro: >
      The loader only supports an undocumented top-level YAML list of mappings
      ('- global: {...}') because it iterates config_data and dict-updates each entry.
      Verified by execution: a natural mapping-shaped config ('global:' as a top-level
      key, the obvious way to write it) makes the loop call update() on the string key
      'global' and raises ValueError ('dictionary update sequence element #0 has length
      5; 2 is required'), killing the command with a traceback. Separately, a list
      config whose entries lack a 'global' section survives loading and then dies at
      the connect path with a KeyError on self.config_data['global']. No path is
      documented anywhere — the help text (see MASH-019) names different files entirely.
    fix_idea: >
      Accept both shapes (mapping or list of mappings) in load_config, then validate
      that the expected keys exist before use; on malformed config, print an error
      showing the expected format instead of raising.
    blast_radius: >
      Any operator hand-writing a config file (the setup path for headless use) hits a
      traceback on their first attempt unless they guess the undocumented
      list-of-dicts shape; only the slash-based fallback chain is discoverable, not
      the schema.
    regression_test: >
      test_config_shape_errors_cleanly: feed load_config a mapping-shaped config and a
      list config missing 'global', assert a clear config error and no exception;
      fails today with ValueError and KeyError tracebacks, passes after the fix.

  - id: MASH-014
    type: bug
    severity: S3
    title: "Foreach silently drops list items containing a hash character"
    user_value: null
    evidence:
      - path: src/mash/app.py
        lines: 362-365
        excerpt: |
          if " " not in arg:
            self.err("Error: Syntax error")
            return
          args = shlex.split(arg, 2)
    repro: >
      shlex.split has no maxsplit parameter; its second positional parameter is
      'comments'. Passing 2 enables comment handling, so any '#' in the remainder
      starts a comment. Verified by execution: shlex.split('n in a b #c d', 2) returns
      ['n', 'in', 'a', 'b'] — the items after '#' are silently dropped. A
      'foreach node in c1 c2 #see-infra' line therefore loops over a truncated list
      with no error, and the loop body runs fewer times than written.
    fix_idea: >
      Call shlex.split with only the string (comments stay disabled), or split the
      line with a partition-based parse that takes the first token, the keyword, and
      the remainder verbatim.
    blast_radius: >
      Any foreach whose list text contains '#' — including inline comments, which are
      natural in script files — silently executes the loop body for a subset of items.
      Wrong-side effects when the body mutates fleet state via CRUD verbs.
    regression_test: >
      test_foreach_preserves_hash_items: run foreach over an inline list containing a
      '#' token and assert the loop body ran once per written item; fails today with
      the tail dropped, passes after the fix.

