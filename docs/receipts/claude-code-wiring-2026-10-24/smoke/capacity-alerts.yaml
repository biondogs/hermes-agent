apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: capacity-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: capacity-alerts
spec:
  groups:
    - name: node-filesystem.rules
      rules:
        - record: node:filesystem_usage:percent
          expr: |
            100 * (
              1 - (
                node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!=""}
                /
                node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!=""}
              )
            )
    - name: node-filesystem.alerts
      rules:
        - alert: NodeFilesystemUsageHigh
          expr: node:filesystem_usage:percent > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Filesystem usage above 85% on node {{ $labels.instance }}"
            description: >-
              Node {{ $labels.instance }} filesystem {{ $labels.mountpoint }}
              (device {{ $labels.device }}) has been at
              {{ $value | printf "%.1f" }}% usage for more than 10 minutes.
              Kubelet disk-pressure eviction may begin soon.
